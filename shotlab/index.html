<style>
/* Layout: one guided lesson at a time. Dark stage block (camera view + set map) on the left, one white step panel on the right. Fungii paper and ink, single light look. */
:root{
  --paper:#F5F5F3; --card:#FFFFFF; --ink:#111; --ink2:#55524E; --ink3:#86827D; --line:#E2DFD9;
  --stage:#1A1A1A; --lime:#F2FFA0; --pink:#FF3D9E; --blue:#0096E8;
  --grot:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif","Times New Roman",serif;
  --pix:"Silkscreen","Courier New",monospace;
  --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  --acc:#F2FFA0;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.5 var(--grot);padding-inline:clamp(16px,2.6vw,36px);padding-block:14px 32px}
button{font:inherit;color:inherit}
.shell{max-width:2560px;margin:0 auto;display:grid;gap:16px}

.bar{display:flex;align-items:center;gap:14px 28px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1.5px solid var(--ink)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand>img{height:40px;width:auto;mix-blend-mode:multiply}
.brand .sl{border-left:1.5px solid var(--ink);padding-left:12px}
.brand h1{margin:0;line-height:0}.brand h1 img{height:26px;width:auto;display:block}
@media (max-width:560px){.brand h1 img{height:20px}.brand>img{height:32px}}
:root{--stripe:linear-gradient(90deg,#0097EA 0% 5.76%,#F7F7F7 5.76% 12.16%,#2ACFAD 12.16% 20.54%,#F6FF9E 20.54% 30.39%,#0097EA 30.39% 39.6%,#6FE9FF 39.6% 49.58%,#FF54B9 49.58% 60.4%,#FFBCB5 60.4% 71.4%,#FF4B32 71.4% 84.9%,#2ACFAD 84.9% 89.12%,#F6FF9E 89.12% 100%)}
.brand b{font:900 22px/1 var(--grot);font-stretch:118%;letter-spacing:-.02em}
.brand small{display:block;font:10px/1 var(--pix);letter-spacing:.08em;color:var(--ink3);margin-top:4px;text-transform:uppercase}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;text-align:left}
.steps button:disabled{cursor:default;opacity:.45}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:12px/1 var(--mono);border:1.5px solid currentColor}
.steps .t{font:600 13px/1.1 var(--grot)}
.steps .v{display:block;font:11px/1.1 var(--mono);color:var(--ink3)}
.steps [aria-current="step"]{border-color:var(--ink);background:var(--c);box-shadow:2px 2px 0 var(--ink)}
.steps [aria-current="step"] .n{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps .done .n{background:var(--c);border-color:var(--ink)}
.steps .fresh{opacity:.72}
.steps .fresh:hover{opacity:1}
.stephint{margin:0;font-size:13px;color:var(--ink2);flex-basis:100%;text-align:right}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.app{display:grid;grid-template-columns:clamp(400px,24vw,560px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.app{grid-template-columns:350px minmax(0,1fr);gap:16px}}
@media (max-width:760px){.app{grid-template-columns:1fr}}
.viewer{display:grid;gap:12px;align-content:start;min-width:0}
@media (min-width:761px) and (min-height:560px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 104px);overflow:auto;overscroll-behavior:contain}.panel .nav{position:sticky;bottom:0;z-index:2}}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.card{background:var(--card);border:1.5px solid var(--ink);padding:16px;display:grid;gap:10px;align-content:start}
.card p{margin:0}
.card.tip{border-style:dashed;border-color:var(--ink3);background:transparent}
.card.empty p{font:italic 400 18px/1.3 var(--serif);color:var(--ink2)}
.howto{margin:0;padding-left:20px;display:grid;gap:8px}
.navr{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.steps .n0{font-size:11px}
.viewtop{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:stretch}
@media (min-width:1280px){.viewtop{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}}

/* stage block */
.bezel{background:var(--stage);padding:14px;display:grid;gap:12px;min-width:0}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:#2a2a2a;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%}
.corners i{position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.75);pointer-events:none}
.corners .a{top:10px;left:10px;border-right:0;border-bottom:0}.corners .b{top:10px;right:10px;border-left:0;border-bottom:0}
.corners .c{bottom:10px;left:10px;border-right:0;border-top:0}.corners .d{bottom:10px;right:10px;border-left:0;border-top:0}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}
.prog b{display:block;height:100%;width:0;background:var(--lime)}
.mapcard{margin:0;background:var(--card);border:1.5px solid var(--ink);display:flex;flex-direction:column;min-width:0}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.maphead b{font:800 15px/1 var(--grot)}
.maphead span{font:10px/1 var(--pix);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.mapwrap{position:relative;flex:1;min-height:0;aspect-ratio:2/1;max-width:100%;background:#ECEBE6}
@media (min-width:1280px){.mapwrap{aspect-ratio:auto;min-height:220px}}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapwrap .dist{position:absolute;left:8px;top:8px;font:12px/1 var(--mono);background:var(--lime);color:var(--ink);padding:5px 7px;border:1px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:14px;height:10px}
.lg.cam{background:#111}
.lg.cone{background:rgba(216,238,46,.8);border:1px solid #111}
.lg.path{height:0;border-top:2px dashed #6E6A64}
.lg.subj{width:10px;height:10px;border-radius:50%;background:#FF1F8E}
.lg.fr{width:26px;height:10px;background:radial-gradient(circle at 5px 5px,#2BD1B0 4px,transparent 4.5px),radial-gradient(circle at 13px 5px,#1E1C1F 4px,transparent 4.5px),radial-gradient(circle at 21px 5px,#FFB8B0 4px,transparent 4.5px)}
.lg.hgt{width:6px;height:12px;background:#111}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1.5px solid var(--ink);padding-top:18px;position:relative;font:10px/1.6 var(--pix);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.foot::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--stripe)}
.foot a{color:var(--ink);text-underline-offset:3px}
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font:12px/1 var(--mono);border:1px solid rgba(245,245,243,.35);padding:6px 8px}
.chips .rec{display:inline-flex;align-items:center;gap:6px;border-color:var(--lime);color:var(--lime)}
.chips .rec i{width:7px;height:7px;border-radius:50%;background:#FF4F33}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools .btn{background:transparent;color:var(--paper);border-color:rgba(245,245,243,.55)}
.tools .btn[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.caption{margin:0;font:italic 400 18px/1.3 var(--serif);color:var(--ink2);max-width:66ch}

/* panel */
.panel{background:var(--card);border:1.5px solid var(--ink);display:grid;align-content:start;min-width:0}
.panel .in{padding:22px 22px 18px;display:grid;gap:14px}
.kicker{font:10px/1 var(--pix);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.panel h2{margin:0;font:900 30px/.98 var(--grot);font-stretch:112%;letter-spacing:-.02em;text-wrap:balance}
.intro{margin:0;font:italic 400 19px/1.3 var(--serif);color:var(--ink2)}
.opts{display:grid;border-top:1.5px solid var(--line)}
.opt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 10px;cursor:pointer;transition:background .12s}
.opt:hover{background:var(--paper)}
.opt .nm{font:600 16px/1.2 var(--grot)}
.opt .tg{font:12px/1 var(--mono);color:var(--ink3);white-space:nowrap}
.opt[aria-checked="true"]{background:var(--acc)}
.opt[aria-checked="true"] .nm{font-weight:800}
.opt[aria-checked="true"] .tg{color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tabs .tab:last-child:nth-child(odd){grid-column:1/-1}
.tab{border:1.5px solid var(--line);background:transparent;text-align:left;padding:9px 10px;cursor:pointer;display:grid;gap:3px}
.tab b{font:700 14px/1.15 var(--grot)}
.tab span{font:11px/1 var(--mono);color:var(--ink3)}
.tab[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] span{color:var(--lime)}
.ginfo{margin:0;font-size:14px;color:var(--ink2)}
.detail{display:grid;gap:10px;background:var(--card);padding:16px;border:1.5px solid var(--ink);align-content:start}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:grid;gap:0;padding:0;text-align:left;background:var(--card);border:1.5px solid var(--line);cursor:pointer;overflow:hidden;transition:border-color .12s}
.tile:hover{border-color:var(--ink3)}
.tile canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%;background:#ECEBE6}
.tile .nm{font:600 14px/1.15 var(--grot);padding:8px 9px}
.tile[aria-checked="true"]{border-color:var(--ink);box-shadow:3px 3px 0 var(--acc)}
.tile[aria-checked="true"] .nm{background:var(--acc);font-weight:800}
.timing{display:grid;gap:12px;border:1.5px solid var(--ink);padding:14px 16px}
.timing .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.timing .th b{font:800 17px/1 var(--grot)}
.timing .row{display:grid;gap:6px}
.timing .lab{display:flex;justify-content:space-between;font:10px/1 var(--pix);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.timing .lab output{font:13px/1 var(--mono);color:var(--ink);letter-spacing:0;text-transform:none}
.timing input[type=range]{width:100%;accent-color:#111}
.eases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.eases button,.amts button{border:1.5px solid var(--line);background:transparent;padding:6px 4px;cursor:pointer;display:grid;justify-items:center;gap:4px;font:600 11px/1.1 var(--grot)}
.eases svg{width:100%;max-width:44px;height:28px}
.eases button[aria-pressed="true"],.amts button[aria-pressed="true"]{border-color:var(--ink);background:var(--acc)}
.amts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.amts button{padding:8px 4px;font-size:13px}
.timing .note{margin:0;font-size:13px;color:var(--ink2)}
.detail h3{margin:0;font:800 19px/1.1 var(--grot);font-stretch:108%}
.detail dl{margin:0;display:grid;gap:8px}
.detail dt{font:10px/1 var(--pix);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.detail dd{margin:2px 0 0}
.detail .watch dd{color:#B3361F}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;justify-self:start}
.seg button{border:0;background:transparent;padding:8px 12px;font:600 13px/1 var(--grot);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.segnote{margin:-6px 0 0;font-size:13px;color:var(--ink2)}
.nav{display:flex;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1.5px solid var(--ink);background:var(--paper)}
.btn{border:1.5px solid var(--ink);background:var(--card);padding:10px 14px;font:700 14px/1 var(--grot);cursor:pointer;border-radius:999px}
.btn.go{background:var(--ink);color:var(--paper)}
.btn.go:hover{background:#333}
.btn.sm{padding:7px 11px;font-size:12px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}
.lead{margin:0;font:900 clamp(34px,4vw,46px)/.92 var(--grot);font-stretch:118%;letter-spacing:-.03em;text-wrap:balance}
.path{list-style:none;margin:0;padding:0;display:grid;border-top:1.5px solid var(--line)}
.path li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.path .n{font:13px/1 var(--mono);color:var(--ink);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink)}
.path b{display:block;font:700 15px/1.3 var(--grot)}
.path span{font-size:14px;color:var(--ink2)}
.sum{display:grid;border-top:1.5px solid var(--line)}
.sum div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.sum .k{font:10px/1 var(--pix);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.sum .val{font:700 15px/1.2 var(--grot)}
.check{padding:12px 14px;border:1.5px solid var(--ink);display:grid;gap:6px}
.check.ok{background:var(--lime)}
.check.bad{background:#FFE6E0}
.check b{font:800 14px/1.2 var(--grot)}
.check ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.tipjar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;background:var(--card);border:1.5px solid var(--ink);padding:14px 16px;transition:box-shadow .3s,transform .3s}
.tipjar p{margin:0;font:italic 400 20px/1.2 var(--serif)}
.tipjar p small{display:block;font:12px/1.4 var(--mono);font-style:normal;color:var(--ink2);margin-top:4px}
.tipjar a{font:12px/1 var(--pix);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;background:var(--lime);border:1.5px solid var(--ink);border-radius:999px;padding:11px 16px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.cup{font:22px/0 system-ui,sans-serif;vertical-align:-3px;margin-left:4px}
.foot .cup{font-size:16px;vertical-align:-2px}
.tipjar a{display:inline-flex;align-items:center;gap:2px}
.tipjar a:hover{background:#E6F58A}.tipjar a:focus-visible{outline:2px solid #0096E8;outline-offset:2px}
.tipjar.idea a{background:#6EE8FF}.tipjar.idea a:hover{background:#9CF0FF}
.tipjar.lit{box-shadow:4px 4px 0 #FF55BB;transform:translateY(-2px)}
.pcol{display:grid;gap:10px;align-content:start}
.prompt{background:var(--ink);color:var(--paper);padding:14px;display:grid;gap:10px}
.prompt .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prompt .h span{font:10px/1 var(--pix);letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.prompt pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.55 var(--mono)}
.prompt .btn{background:var(--lime);color:var(--ink);border-color:var(--lime)}
@media (max-width:560px){.panel h2{font-size:26px}.steps .v{display:none}.steps .t{font-size:12px}.bezel{padding:8px}.chips span:nth-child(n+4){display:none}.mapwrap{aspect-ratio:16/10}.legend{font-size:11px}}
@media (prefers-reduced-motion:reduce){.opt{transition:none}}
@media (max-width:760px){.viewer{display:contents}.viewtop{order:1}.caption{order:2}.panel{order:3}.explain{order:4}}
/* big screens: fill the width, keep the reading panel comfortable */
@media (min-width:1700px){body{font-size:16px}.lead{font-size:clamp(46px,2.6vw,64px)}.panel h2{font-size:clamp(30px,1.9vw,44px)}.caption{font-size:20px;max-width:80ch}.app{gap:24px}}
@media (min-width:2200px){body{font-size:17px}.caption{font-size:22px}}
</style>

  g.fillStyle='#D3D0C9';g.strokeStyle='#B9B4AC';g.beginPath();g.arc(X(PLAN.tower[0]),Y(PLAN.tower[1]),PLAN.tower[2]*sc,0,7);g.fill();g.stroke();
  PLAN.walls.forEach(b=>rect(b[0],b[1],b[2],b[3],'#C9C5BD'));
  PLAN.planters.forEach(b=>rect(b[0],b[1],b[2],b[3],'#D9D6CF','#C2BDB4'));
  g.fillStyle='rgba(95,150,72,.55)';PLAN.trees.forEach(t=>{g.beginPath();g.arc(X(t[0]),Y(t[1]),.7*sc,0,7);g.fill();});

}
/* ---------- mini previews: top / side / frame diagrams driven by the real move math ---------- */
function miniPose(id,p){const e0=EASES[S.ease].f(p),e=AMT_MOVES.has(id)?e0*AMTS[S.amt].v:e0;
  return pose(id,p,e,p*4,3.2,vfov(47),1.3,1.25);}
function dirOf(o){let dx=o.l[0]-o.c[0],dy=o.l[1]-o.c[1],dz=o.l[2]-o.c[2];const n=Math.hypot(dx,dy,dz)||1;dx/=n;dy/=n;dz/=n;
  const cy=Math.cos(o.yaw),sy=Math.sin(o.yaw);let x=dx*cy+dz*sy,z=-dx*sy+dz*cy;
  const hz=Math.hypot(x,z)||1e-6,cp=Math.cos(o.pitch),sp=Math.sin(o.pitch);
  const h2=hz*cp-dy*sp,y2=hz*sp+dy*cp;return [x/hz*h2,y2,z/hz*h2];}
function miniBounds(m){const id=m.id,view=MINI_VIEW[id]||'top';let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(let i=0;i<=40;i++){const o=miniPose(id,i/40);const pts=[[o.c,0],[[o.h[0],0,o.h[1]],1]];
    pts.forEach(([q])=>{const u=view==='side'?-q[2]:q[0],v=view==='side'?-q[1]:q[2];a=Math.min(a,u);b=Math.max(b,u);c=Math.min(c,v);d=Math.max(d,v);});}
  if(view==='side'){d=Math.max(d,0);c=Math.min(c,-1.8);}
  const cx=(a+b)/2,cz=(c+d)/2,span=Math.max(3.2,(b-a)*1.25,(d-c)*1.25*4/3);return {cx,cz,span,view};}

  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  if(!m.bb)m.bb=miniBounds(m);const bb=m.bb,id=m.id;
  const T=(now/1000)%(3.4),p=clamp((T-.4)/2.6),o=miniPose(id,p);
  g.fillStyle='#ECEBE6';g.fillRect(0,0,w,h);
  if(bb.view==='frame'){
    g.save();g.translate(w/2,h/2);g.rotate(-o.roll);
    g.strokeStyle='#111';g.lineWidth=2;g.strokeRect(-w*.36,-h*.33,w*.72,h*.66);
    g.strokeStyle='#C9C5BE';g.lineWidth=1;g.beginPath();g.moveTo(-w*.36,h*.12);g.lineTo(w*.36,h*.12);g.stroke();
    const blurS=id==='rack'?(1-o.rack)*3.5:0,blurF=id==='rack'?o.rack*4:0;
    g.filter='blur('+blurS+'px)';g.fillStyle='#FF1F8E';g.fillRect(-w*.05,-h*.06,w*.1,h*.18);g.fillStyle='#F0B08C';g.beginPath();g.arc(0,-h*.12,w*.055,0,7);g.fill();
    g.fillStyle='#D8EE2E';g.beginPath();g.arc(0,-h*.15,w*.057,Math.PI,0);g.fill();
    if(id==='rack'){g.filter='blur('+blurF+'px)';g.fillStyle='#3E6FA8';g.beginPath();g.arc(-w*.22,h*.16,w*.12,0,7);g.fill();}
    g.filter='none';g.restore();return;}
  const sc=w/bb.span,X=u=>w/2+(u-bb.cx)*sc,Y=v=>h/2+(v-bb.cz)*sc;

  if(bb.view==='top'){for(let k=Math.floor(bb.cz-bb.span);k<=bb.cz+bb.span;k++){g.moveTo(0,Y(k));g.lineTo(w,Y(k));}}

    else{g.fillStyle='#FF1F8E';g.beginPath();g.arc(hx,hy,Math.max(4,.32*sc),0,7);g.fill();

  g.lineTo(cx+Math.cos(ang-half)*L,cyy+Math.sin(ang-half)*L);g.lineTo(cx+Math.cos(ang+half)*L,cyy+Math.sin(ang+half)*L);g.closePath();g.fill();

  g.save();g.translate(cx,cyy);g.rotate(ang);g.fillStyle='#111';g.fillRect(-9,-6,12,12);g.fillStyle='#FF1F8E';g.fillRect(3,-4,5,8);g.restore();
  if(id==='reveal'&&o.occ){g.fillStyle='#3A3D40';const ox=X(o.occ[0]),oz=Y(o.occ[2]),r=o.occ[3]*sc/2;g.fillRect(ox-r,oz-r,2*r,2*r);}
}
const _frame=frame;
frame=function(now){_frame(now);minis.forEach(m=>drawMini(m,now));};
