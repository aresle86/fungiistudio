<style>

*{box-sizing:border-box}

#cfCur{position:fixed;left:0;top:0;z-index:40;pointer-events:none;font:11px/1 var(--pix);letter-spacing:.06em;text-transform:uppercase;color:#111;background:var(--lime);border:1.5px solid #111;border-radius:999px;padding:7px 11px;box-shadow:2px 2px 0 #111;opacity:0;transition:opacity .15s,background .15s;white-space:nowrap}

#wallGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 22px;align-items:start}
.note{position:relative;min-height:190px;padding:26px 16px 14px;border:1.5px solid #111;box-shadow:4px 5px 0 rgba(17,17,17,.9);display:flex;flex-direction:column;gap:10px;color:#111;transform:rotate(var(--r,0deg))}
.note p{margin:0;font:14px/1.4 "IBM Plex Mono",var(--mono);flex:1;overflow-wrap:anywhere}
.note .by{display:flex;flex-direction:column;gap:3px;color:#3a3835}.note .by b{font:400 10px/1.3 var(--pix);letter-spacing:.06em;text-transform:uppercase;color:#111}.note .by span{font:italic 400 15px/1.2 var(--serif);overflow-wrap:anywhere}
.note time{position:absolute;left:12px;top:8px;font:9px/1 var(--pix);letter-spacing:.08em;text-transform:uppercase;color:rgba(17,17,17,.5)}
.tape{position:absolute;left:50%;top:-11px;width:78px;height:22px;margin-left:-39px;background:rgba(245,245,243,.72);border:1px solid rgba(17,17,17,.25);transform:rotate(calc(var(--r,0deg) * -2))}
.p0{background:#F2FFA0}.p1{background:#FFB8B0}.p2{background:#BFEFF7}.p3{background:#BFE9E0}.p4{background:#FBFBF8}
.note.sample::after{content:"SAMPLE";position:absolute;right:8px;top:6px;font:9px/1 var(--pix);letter-spacing:.08em;color:rgba(17,17,17,.45)}
.note.pending{border-style:dashed;box-shadow:none;animation:stick .6s cubic-bezier(.2,1.4,.4,1) both}
.note.pending .stamp{align-self:flex-start;transform:rotate(-4deg);font:10px/1.2 var(--pix);letter-spacing:.06em;text-transform:uppercase;color:#FF4F33;border:2px solid #FF4F33;padding:4px 6px;text-align:center;background:rgba(251,251,248,.6)}
@keyframes stick{0%{transform:translateY(-40px) rotate(-14deg) scale(1.25);opacity:0}100%{transform:rotate(var(--r,0deg));opacity:1}}
.nf{grid-column:span 2;position:relative;background:#FBFBF8;border:2px solid #111;box-shadow:6px 6px 0 #111;padding:28px 16px 16px;display:flex;flex-direction:column;gap:10px}
.nf textarea,.nf input{font:14px/1.4 "IBM Plex Mono",var(--mono);color:#111;background:transparent;border:0;border-bottom:1.5px solid #111;padding:6px 2px;border-radius:0;width:100%;min-width:0;outline:none}
.nf textarea{resize:none;border:1.5px dashed rgba(17,17,17,.4);padding:10px;min-height:118px;transition:background .2s}
.nf textarea:focus,.nf input:focus{background:rgba(242,255,160,.45)}
@media (pointer:coarse){.nf textarea,.nf input{font-size:16px}} /* iOS zooms the page into any field under 16px */.nf textarea:focus{border-style:solid;border-color:#111}
.nf ::placeholder{color:#8a8680}
.nfRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nfFoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{border:0;margin:0;padding:0;display:flex;gap:8px;align-items:center}
.sw label{width:24px;height:24px;border:1.5px solid #111;border-radius:50%;cursor:pointer;display:block;position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw input:checked+label{box-shadow:0 0 0 2px #FBFBF8,0 0 0 4px #111}.sw input:focus-visible+label{outline:2px solid var(--blue);outline-offset:4px}
.cnt{font:10px/1 var(--pix);letter-spacing:.06em;color:var(--ink2)}.cnt.hot{color:#FF4F33}
#nfGo{align-self:flex-start;font:12px/1 var(--pix);letter-spacing:.06em;text-transform:uppercase;background:var(--pink);color:#111;border:1.5px solid #111;padding:12px 16px;cursor:pointer;box-shadow:3px 3px 0 #111;transition:transform .12s,box-shadow .12s}
#nfGo:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #111}#nfGo:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
#nfGo:focus-visible,#wallClose:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nf .msg{margin:0;min-height:1.3em;font:12px/1.3 var(--mono);color:var(--ink2)}.nf .msg.err{color:#C8321A}
.nf.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wallEmpty{grid-column:1 / -1;margin:8px 0;font:italic 400 20px/1.3 var(--serif);color:var(--ink2)}#nfGo:disabled{opacity:.6;cursor:progress}.clist li.wallRow button{background:var(--pink)}.clist li.wallRow button:hover{background:#FF7FCC}
@media (prefers-reduced-motion:reduce){.note.pending,.nf.shake{animation:none}}
@media (max-width:820px),(max-aspect-ratio:9/10){
  #nav button{padding:8px 9px;font-size:11px}#nav button.hot{padding:6.5px 11px}
  #nav button[data-go="2"]{display:none}
  #tools span{display:none}#stLabel{font-size:10px}#pips{display:none}
  #hBot{grid-template-columns:1fr auto}
  #tools{flex-direction:column;align-items:flex-end;gap:6px}#tools button{padding:6px 9px}
  .bio{width:calc(50vw - 24px);bottom:calc(94px + env(safe-area-inset-bottom,0px))}
  .bio .nm{font-size:30px}.bio .role{font-size:17px;margin:3px 0 8px}.bio li{font-size:10px;padding:4px 0 4px 16px}
  .bio li:nth-child(n+4){display:none}
  .bio.r li{padding:4px 16px 4px 0}
  #s5cap{top:calc(98px + env(safe-area-inset-top,0px));bottom:auto}
  #workCap{top:calc(98px + env(safe-area-inset-top,0px));bottom:auto}
  .bio li:nth-child(n+3){display:none}
  #scrollHint{bottom:calc(52px + env(safe-area-inset-bottom,0px));padding:5px 11px 5px 8px;gap:7px;box-shadow:2px 2px 0 #111}#scrollHint .mouse{width:12px;height:18px;border-width:1.5px}#scrollHint .mouse i{top:3px;height:4px;width:2px;margin-left:-1px}#scrollHint b{font-size:10px}#scrollHint small{display:none}#scrollHint.s0{bottom:calc(60px + env(safe-area-inset-bottom,0px))}#ovMedia{height:auto}#ovInfo{max-height:none;overflow:visible}#workCap h2{font-size:38px}
  #reelCap{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  #s1title{top:calc(76px + env(safe-area-inset-top,0px));transform:none;font-size:clamp(44px,13vw,72px)}
  #workCtl{bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px)}#workCtl button{padding:8px 10px}#cfLabel{font-size:15px;min-width:0;max-width:34vw}#cfOpen{display:none}#allFilms{white-space:nowrap;font-size:10px!important}
  #s7txt{left:16px;right:16px;top:calc(70px + env(safe-area-inset-top,0px));transform:none;max-width:none;gap:10px}
  #s7txt h2{font-size:clamp(44px,13vw,72px)}
  #s7txt .clist{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:rgba(245,245,243,.9)}
  .clist li{grid-template-columns:78px 1fr auto;padding:7px 0;font-size:12px}
  #s7txt .place{display:none}
  #wallGrid{grid-template-columns:1fr 1fr;gap:20px 14px}.nf{grid-column:1 / -1}.note{min-height:150px;padding:22px 12px 10px}.note p{font-size:13px}#wall h3{font-size:42px}
  #ov{grid-template-columns:1fr;grid-template-rows:auto;align-content:start;overflow:auto;padding-top:calc(64px + env(safe-area-inset-top,0px))}
  #ovMedia video{max-height:56vh;box-shadow:6px 6px 0 #111}#ovMedia .yt{max-width:100%;box-shadow:6px 6px 0 #111}#ovMedia .yt.v{height:auto;width:min(100%,calc(62vh * 9 / 16));margin:0 auto}
}
@media (max-height:520px) and (min-aspect-ratio:13/10){
  #miniLogo{width:72px}#nav button{padding:7px 11px;font-size:11px}#nav button.hot{padding:5.5px 12px}
  #pips{display:none}#hBot{grid-template-columns:1fr auto}#stLabel{font-size:10px}
  #scrollHint,#scrollHint.s0{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:5px 11px 5px 8px;gap:7px;box-shadow:2px 2px 0 #111}#scrollHint .mouse{width:12px;height:18px;border-width:1.5px}#scrollHint .mouse i{top:3px;height:4px;width:2px;margin-left:-1px}#scrollHint b{font-size:10px}#scrollHint small{display:none}
  #s1title{top:calc(64px + env(safe-area-inset-top,0px));transform:none;font-size:clamp(34px,11vh,60px)}
  #reelCap{bottom:calc(44px + env(safe-area-inset-bottom,0px))}#reelCap h2{font-size:18px}
  .bio{bottom:calc(46px + env(safe-area-inset-bottom,0px));width:min(24vw,260px)}.bio .nm{font-size:28px}.bio .role{font-size:15px;margin:2px 0 4px}.bio .quote{font-size:10px;margin:0}.bio ul{display:none}
  #s5cap{bottom:auto;top:calc(58px + env(safe-area-inset-top,0px))}#s5cap h2{font-size:18px}
  #workCap{top:calc(60px + env(safe-area-inset-top,0px))}#workCap h2{font-size:30px}
  #workCtl{bottom:calc(46px + env(safe-area-inset-bottom,0px))}#workCtl button{padding:7px 10px}#cfOpen{display:none}
  #s7txt{top:calc(60px + env(safe-area-inset-top,0px));transform:none;gap:6px;max-width:50vw}#s7txt h2{font-size:clamp(32px,10vh,52px)}#s7txt .lead{font-size:14px}
  .clist li{padding:3px 0;font-size:12px;grid-template-columns:84px 1fr auto}#s7txt .place{display:none}
  #ov{grid-template-columns:1fr 1fr;padding-top:52px}#ovInfo h3,#ovInfo h3.long{font-size:26px}#ovInfo p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){#scrollHint .mouse i{animation:none}#loading i{animation:none}#snd.on i s{animation:none}}
