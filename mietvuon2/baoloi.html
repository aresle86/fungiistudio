<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Báo lỗi Miệt Vườn</title>
<style>
:root{--bg:#F5EEDF;--card:#FFFBF2;--ink:#3E2A1C;--mute:#7A6249;--line:#E3D3BC;--go:#5E8F48;--warn:#B8452A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}button{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}button[aria-pressed=true]{background:var(--go);border-color:var(--go);color:#fff}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.c.done{opacity:.55}.h{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}.h b{font-size:17px}.k{font-size:14px;color:var(--mute)}.m{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bad{color:var(--warn);font-weight:600}
img{max-width:100%;max-height:360px;border-radius:8px;display:block;margin:8px 0;cursor:zoom-in}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#F3EADB;padding:8px;border-radius:8px;margin:8px 0}details{margin:6px 0;font-size:14px}summary{cursor:pointer;color:var(--mute);min-height:28px}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:#fff;margin:8px 0}
</style></head><body><main><h1>Báo lỗi Miệt Vườn</h1><div id="a"></div></main>
<script>
const SB={url:'https://zgfanxtjdvioxpgpbcke.supabase.co',key:'sb_publishable_C9yQE4moNWh6YPf6Oofdjg_hHrutuok'},A=document.getElementById('a');
let KEY='',TAB='reports',D=null,SHOWDONE=false;try{KEY=localStorage.getItem('mv-bl-key')||''}catch(e){}
const KN={ket:'Kẹt, không chơi được',matdo:'Mất đồ, mất xu',hinh:'Hình lỗi',gopy:'Góp ý'};
const rpc=async(f,b)=>{const r=await fetch(`${SB.url}/rest/v1/rpc/${f}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(b)});const t=await r.text();if(!r.ok)throw new Error(/denied/.test(t)?'denied':'net');return t?JSON.parse(t):null};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=s=>new Date(s).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dev=m=>{if(!m)return '';const u=m.ua||'';const o=/iPhone|iPad/.test(u)?(u.match(/iPhone|iPad/)[0]+' iOS '+((u.match(/OS (\d+)/)||[])[1]||'')):/Android/.test(u)?'Android '+((u.match(/Android (\d+)/)||[])[1]||''):/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':'Máy khác';return `${o} · ${m.w}×${m.h}`};
function login(msg){A.innerHTML=`<div class="c"><label for="k">Khóa quản trị</label><input id="k" type="password" autocomplete="off"><button id="go">Mở</button>${msg?`<p class="bad">${msg}</p>`:''}</div>`;document.getElementById('go').onclick=()=>{KEY=document.getElementById('k').value.trim();load()}}
async function load(){A.innerHTML='<p class="k">Đang tải…</p>';try{D=await rpc('mv2_admin_list',{p_key:KEY});try{localStorage.setItem('mv-bl-key',KEY)}catch(e){}draw()}catch(e){if(e.message==='denied'){try{localStorage.removeItem('mv-bl-key')}catch(er){}login('Khóa không đúng.')}else A.innerHTML=`<p class="bad">Không tải được, kiểm tra mạng.</p><button onclick="load()">Thử lại</button>`}}
function draw(){const R=D.reports||[],E=D.errs||[],nr=R.filter(x=>!x.done).length,ne=E.filter(x=>!x.done).length;const L=(TAB==='reports'?R:E).filter(x=>SHOWDONE||!x.done);
A.innerHTML=`<div class="tabs"><button data-t="reports" aria-pressed="${TAB==='reports'}">Người chơi báo (${nr})</button><button data-t="errs" aria-pressed="${TAB==='errs'}">Lỗi tự ghi (${ne})</button><button id="sd" aria-pressed="${SHOWDONE}">Hiện đã xử lý</button><button id="rl">Tải lại</button></div>`+(L.length?L.map(TAB==='reports'?rc:ec).join(''):'<p class="k">Chưa có gì mới.</p>');}
const rc=x=>{const m=x.meta||{};return `<div class="c${x.done?' done':''}"><div class="h"><b>${esc(KN[x.kind]||x.kind)}</b><span class="k">${when(x.created_at)}</span></div><div class="k">${esc(x.code||'Không rõ vườn')}${x.verified?'':' · chưa xác thực'} · cấp ${esc(m.lv)} · ${esc(m.xu)} xu · ${esc(m.build)} · ${esc(dev(m))}</div>${x.msg?`<div class="m">${esc(x.msg)}</div>`:''}${x.shot&&/^data:image\/jpeg;base64,/.test(x.shot)?`<img src="${x.shot}" alt="Ảnh người chơi gửi">`:''}<details><summary>Chi tiết máy</summary><pre>${esc(JSON.stringify(m,null,1))}</pre></details><button data-d="reports" data-i="${x.id}" data-v="${!x.done}">${x.done?'Mở lại':'Đã xử lý'}</button></div>`};
const ec=x=>`<div class="c${x.done?' done':''}"><div class="h"><b>${esc(x.msg)}</b><span class="k">${when(x.last_at)}</span></div><div class="k"><span class="bad">${x.n} lần</span> · đầu tiên ${when(x.first_at)} · ${esc(x.build)} · ${esc(dev(x.meta))}</div>${x.stack?`<details><summary>Dấu vết</summary><pre>${esc(x.stack)}</pre></details>`:''}<button data-d="errs" data-i="${esc(x.sig)}" data-v="${!x.done}">${x.done?'Mở lại':'Đã xử lý'}</button></div>`;
A.addEventListener('click',async e=>{const b=e.target.closest('button,img');if(!b)return;if(b.tagName==='IMG'){window.open().document.write(`<img src="${b.src}" style="max-width:100%">`);return}if(b.dataset.t){TAB=b.dataset.t;draw()}else if(b.id==='sd'){SHOWDONE=!SHOWDONE;draw()}else if(b.id==='rl')load();else if(b.dataset.d){b.disabled=true;try{await rpc('mv2_admin_done',{p_key:KEY,p_tbl:b.dataset.d,p_id:b.dataset.i,p_done:b.dataset.v==='true'});const k=b.dataset.d==='reports'?'id':'sig';const it=D[b.dataset.d].find(x=>String(x[k])===b.dataset.i);if(it)it.done=b.dataset.v==='true';draw()}catch(er){b.disabled=false;alert('Chưa lưu được, thử lại.')}}});
KEY?load():login();
</script></body></html>
