<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.169.0/+esm';

const $ = s => document.querySelector(s);
const showErr = m => { const e = $('#err'); e.textContent = m; e.style.display = 'block'; };

const VISIT = (() => { try { return JSON.parse(sessionStorage.getItem('mv2-visit') || 'null'); } catch (e) { return null; } })();

const store = { get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- quality ---------- */
const MOBILE = matchMedia('(pointer:coarse)').matches || Math.min(screen.width, screen.height) < 700;
const BUBS = MOBILE ? 1.28 : 1;   // bóng báo to hơn trên điện thoại, dễ chạm
const QL = ['Thấp', 'Vừa', 'Cao'];
let QI = +(store.get('mv3d-q') ?? (MOBILE ? 1 : 2)); if (!(QI >= 0 && QI <= 2)) QI = 1;
const QS = [{ pr: 1, sh: 0, fx: .4 }, { pr: Math.min(devicePixelRatio, 1.5), sh: 2048, fx: .75 }, { pr: Math.min(devicePixelRatio, 2), sh: 4096, fx: 1 }];

/* ---------- renderer ---------- */
const canvas = $('#c');
const r = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

const S = new T.Scene(); S.background = new T.Color('#86B06A');
let sd = 11; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647, R = (a, b) => a + rnd() * (b - a), pick = a => a[Math.floor(rnd() * a.length)];

/* ---------- palette (bảng màu game) ---------- */
const PALA_ = ['#E25A3B','#C24A2E','#9E3B24','#F08A6E','#EDB940','#C9952A','#F5D27A','#3E6FA6','#2E5585','#6E95C4','#8CC3CC','#6FA7B3','#B5DCE1','#5A93A0','#6E9F57','#4F7D44','#86B06A','#3D6436','#2C4A2A','#D2A57E','#B48560','#8A5D3B','#E3BC97','#6B4529','#4A2F1E','#FBF7EE','#E8DFCC','#2B3446'].map(h => new T.Color(h));
const SN = {}; function snap(c){ if (SN[c]) return SN[c]; const a = new T.Color(c), ha = {}, hb = {}; a.getHSL(ha); let best = null, bd = 1e9;

const DYN = g => { g.userData.dyn = true; return g; };
const CONTACT = new T.MeshBasicMaterial({ color: '#2C4A2A', transparent: true, opacity: .28, depthWrite: false });
const contact = (g, r = .1, sx = 1.3) => { const m = new T.Mesh(new T.CircleGeometry(r, 12), CONTACT); m.rotation.x = -Math.PI / 2; m.position.y = .004; m.scale.set(sx, 1, 1); m.userData.keep = true; m.castShadow = false; g.add(m); return m; };
const sway = (amp, fn) => { const p = SWAY; SWAY = amp; const v = fn(); SWAY = p; return v; };
const box = (w, h, d) => new T.BoxGeometry(w, h, d), cyl = (a, b, h, n = 6) => new T.CylinderGeometry(a, b, h, n), ico = (rr, d = 0) => new T.IcosahedronGeometry(rr, d), cone = (rr, h, n = 5) => new T.ConeGeometry(rr, h, n), sph = (rr, a = 8, b = 6) => new T.SphereGeometry(rr, a, b);
const C = { grass: '#7fbc52', grassL: '#90c85c', soil: '#8b5530', soilL: '#a8703f', soilD: '#6a4224', water: '#4fa9bf', leaf: '#5aa83e', leafL: '#8fd468', leafM: '#6fbe4a', leafD: '#3f8a34', leafP: '#b6e57a', red: '#e8453a', yel: '#ffd23f', straw: '#f0d27a', strawD: '#c9a04a', wood: '#c99a5a', woodD: '#8a5a2b', bamboo: '#cdb46a', thatch: '#E3BC97', thatchD: '#D2A57E', wall: '#d9a86a', wallD: '#a8743e', white: '#fbf7ee', ink: '#3a2a1c', orange: '#f2a33a' };

/* ---------- shared uniforms + sway shader ---------- */
const U = { uTime: { value: 0 }, uWind: { value: .7 }, uNight: { value: 0 } };
const SWAY_VS = `#include <begin_vertex>
  float hS = max(position.y, 0.0);

const swayDepth = side => swayPatch(new T.MeshDepthMaterial({ depthPacking: T.RGBADepthPacking, side }));
const SD = { 0: swayDepth(T.FrontSide), 2: swayDepth(T.DoubleSide) };

/* ---------- leaf geometry ---------- */
const LG = {}; function leafGeo(L, Wd, fold = .35, droop = .3, seg = 6){ const k = [L, Wd, fold, droop, seg].join(); if (LG[k]) return LG[k]; const pos = [];

/* ---------- ground (mương và sông được khoét xuống thấp hơn mặt đất) ---------- */
const R0 = 8.35, R1 = 10.6, WLD = -.055, WLR = -.075;
const HOLES = { value: [new T.Vector4(1.0, 3.6, 6.2, 4.15), new T.Vector4(1.0, 4.95, 6.2, 5.45), new T.Vector4(6.3, 2.8, 6.9, 6.25), new T.Vector4(-30, R0, 40, R1), new T.Vector4(0, 0, 0, 0), new T.Vector4(0, 0, 0, 0)] };   // 2 ô cuối: mương góc vườn mới
{ const g = new T.PlaneGeometry(90, 90, 90, 90).toNonIndexed(); g.rotateX(-Math.PI / 2); const p = g.attributes.position, col = [], tmp = new T.Color();
  for (let i = 0; i < p.count; i++){ const X = p.getX(i), Z = p.getZ(i); p.setY(i, (Math.sin(X * 1.7 + Z * .9) + Math.cos(Z * 2.1 - X * .6)) * .004 - .004); }
  for (let i = 0; i < p.count; i += 3){ sd = (i * 7 + 3) % 2147483646 + 1; tmp.set(snap(pick([C.grass, C.grass, C.grassL, '#86c056', '#78b44c']))); for (let k = 0; k < 3; k++) col.push(tmp.r, tmp.g, tmp.b); }
  g.setAttribute('color', new T.Float32BufferAttribute(col, 3)); g.computeVertexNormals(); const gm = new T.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 });
  gm.onBeforeCompile = sh => { sh.uniforms.uHoles = HOLES; sh.vertexShader = 'varying vec3 vGw;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vGw = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'uniform vec4 uHoles[6];\nvarying vec3 vGw;\n' + sh.fragmentShader.replace('void main() {', 'void main() {\n for (int i = 0; i < 6; i++){ vec4 h = uHoles[i]; if (vGw.x > h.x && vGw.x < h.z && vGw.z > h.y && vGw.z < h.w) discard; }'); };
  gm.customProgramCacheKey = () => 'groundholes'; const m = new T.Mesh(g, gm); m.position.set(5, 0, 4); m.receiveShadow = true; m.userData.keep = true; S.add(m); }
sd = 21;

/* ---------- water shader ---------- */
function waterMat(col, flow, waves){ const m = new T.MeshStandardMaterial({ color: snap(col), roughness: .28, metalness: .05, flatShading: true });
  m.onBeforeCompile = sh => { Object.assign(sh.uniforms, U); sh.uniforms.uFlow = { value: flow };
    sh.vertexShader = 'uniform float uTime;\nvarying vec3 vW;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec4 wpS = modelMatrix * vec4(transformed, 1.0); vW = wpS.xyz;
      transformed.y += (sin(wpS.x * 2.1 + uTime * 1.3) * .5 + sin(wpS.z * 3.7 - uTime * 1.7 + wpS.x) * .5) * ${waves.toFixed(3)};`);
    sh.fragmentShader = 'uniform float uTime;\nuniform float uFlow;\nuniform float uNight;\nvarying vec3 vW;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      float fl = vW.x * 1.1 - uTime * uFlow * 2.0 + sin(vW.z * 5.0 + uTime * .7) * .06;
      float st = smoothstep(.965, .995, fract(fl)) * smoothstep(.2, .9, sin(vW.z * 7.0 + vW.x * 2.3 + uTime * .3));
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.85, .96, 1.0), st * .42 * (1.0 - uNight * .6));`); };

/* ---------- beds & ditches ---------- */
const Y = .035;
function bed(u0, v0, u1, v1, opt = {}){ const g = new T.BoxGeometry(u1 - u0, .07, v1 - v0, Math.round((u1 - u0) * 5), 1, 3).toNonIndexed(); const p = g.attributes.position; for (let i = 0; i < p.count; i++){ const X = p.getX(i), Yv = p.getY(i), Z = p.getZ(i); if (Yv > 0){ p.setY(i, Yv + Math.sin(X * 13 + Z * 7) * .008 + .006); const hw = (u1 - u0) / 2, hl = (v1 - v0) / 2; p.setX(i, X * (1 - .045 / hw)); p.setZ(i, Z * (1 - .045 / hl)); } p.setX(i, p.getX(i) + Math.sin(X * 31.7 + Z * 17.3) * .006); } g.computeVertexNormals(); M(g, C.soil, (u0 + u1) / 2, 0, (v0 + v1) / 2);   // mép trên thu vào: liếp vun mô, không ra tấm ván
  if (opt.furrow) for (const t of opt.furrow) M(box(u1 - u0 - .06, .02, .07), C.soilL, (u0 + u1) / 2, Y, v0 + (v1 - v0) * t, { cast: false }); }
const WM_D = waterMat(C.water, .12, .004);
function basin(u0, v0, u1, v1, d, wl, wm, segX = 3){ const t = .03, cx = (u0 + u1) / 2, cz = (v0 + v1) / 2, w = u1 - u0, l = v1 - v0;
  M(box(w, .02, l), C.soilD, cx, -d, cz, { cast: false });
  // bờ dốc thoai thoải thay cho vách đứng (vách đứng mỏng bị chớp khi kéo camera)
  const sw = d * 1.25, sl = Math.hypot(sw, d), ang = Math.atan2(d, sw);
  for (const sg of [-1, 1]){ const zz = sg < 0 ? v0 + sw / 2 : v1 - sw / 2; M(box(w, .012, sl), '#8B6B47', cx, -d / 2 - .01, zz, { cast: false, r: [-sg * ang, 0, 0] });
    const xx = sg < 0 ? u0 + sw / 2 : u1 - sw / 2; M(box(sl, .012, l), '#8B6B47', xx, -d / 2 - .01, cz, { cast: false, r: [0, 0, sg * ang] }); }
  for (const [x, z, bw, bl] of [[cx, v0 + .01, w + .02, .07], [cx, v1 - .01, w + .02, .07], [u0 + .01, cz, .07, l + .02], [u1 - .01, cz, .07, l + .02]]) M(box(bw, .02, bl), '#74AA4E', x, -.007, z, { cast: false });
  const g = new T.PlaneGeometry(w - .04, l - .04, Math.ceil(w * segX), 2); g.rotateX(-Math.PI / 2); const wv = new T.Mesh(g, wm); wv.position.set(cx, wl, cz); wv.receiveShadow = true; wv.userData.keep = true; S.add(wv); }

function mulch(u0, v0, u1, v1){ for (let i = 0; i < (u1 - u0) * (v1 - v0) * 110; i++) M(box(R(.1, .2), .012, .018), pick(['#C9952A', '#B48560', '#B8913E']), R(u0 + .04, u1 - .04), Y + .005, R(v0 + .04, v1 - .04), { r: [R(-.1, .1), R(0, 3.14), 0], cast: false }); }
const B1 = [1.0, 2.8, 6.2, 3.6], M1 = [1.0, 3.6, 6.2, 4.15], B2 = [1.0, 4.15, 6.2, 4.95], M2 = [1.0, 4.95, 6.2, 5.45], B3 = [1.0, 5.45, 6.2, 6.25], M3 = [6.3, 2.8, 6.9, 6.25];
const EXP = (() => { try { const s = VISIT ? VISIT.state : JSON.parse(store.get('mv2-state') || 'null'); return !!(s && s.exp); } catch (e) { return false; } })(), LW = 1.225, LGAP = .1, LX = i => 1.0 + i * (LW + LGAP), D1 = [8.5, 3.0, 8.5 + LW * 2 + LGAP, 3.8];   // liếp ngắn đều nhau: rộng 1,225, cách nhau 0,1
const M4 = [D1[0], D1[3], D1[2], D1[3] + .5], M5 = [D1[0], D1[1] - .5, D1[2], D1[1]], DITCH = EXP ? [M1, M2, M3, M4, M5] : [M1, M2, M3];   // góc vườn mới: liếp nằm giữa hai mương như liếp cũ
if (EXP){ HOLES.value[4].set(...M4); HOLES.value[5].set(...M5); bed(D1[0], D1[1], D1[0] + LW, D1[3]); bed(D1[0] + LW + LGAP, D1[1], D1[2], D1[3]); ditch(...M4); ditch(...M5); }

ditch(1.0, M1[1], 6.2, M1[3]); ditch(1.0, M2[1], 6.2, M2[3]); ditch(...M3);

/* ---------- plants ---------- */
function bloom(p, x, y, z, col, n = 5, r = .022){ const f = G(x, y, z, R(0, 6.28), p); for (let k = 0; k < n; k++) M(sph(r, 5, 4), col, Math.cos(k * 6.28 / n) * r * 1.1, 0, Math.sin(k * 6.28 / n) * r * 1.1, { p: f, s: [1, .45, 1], cast: false }); M(sph(r * .55, 5, 4), '#EDB940', 0, .006, 0, { p: f, cast: false }); return f; }

  if (fl) for (let k = 0; k < 3; k++){ const a = k * 2.1 + R(-.3, .3), h = R(.22, .3); M(cyl(.004, .006, h, 3), C.leafM, Math.cos(a) * .03, h / 2, Math.sin(a) * .03, { p: g, r: [Math.sin(a) * .25, 0, -Math.cos(a) * .25] }); for (let j = 0; j < 4; j++) M(sph(.014, 5, 4), C.yel, Math.cos(a) * .06 + R(-.025, .025), h + R(-.03, .02), Math.sin(a) * .06 + R(-.025, .025), { p: g, cast: false }); } }

  if (fl){ const h = .42 * s; M(cyl(.005, .006, h, 4), C.leafL, 0, h / 2, 0, { p: g }); const u = G(0, h, 0, 0, g); for (let k = 0; k < 12; k++){ const a = k * 2.4, e = k / 12; M(sph(.011, 5, 4), '#FBF7EE', Math.cos(a) * .035 * Math.sin(e * 3.1), .03 * Math.cos(e * 3.1), Math.sin(a) * .035 * Math.sin(e * 3.1), { p: u, cast: false }); } } }
function ot(x, z, o = { s: 1, fruit: true }){ const g = G(x, Y, z, R(0, 6.28)); g.scale.setScalar(o.s ?? 1); M(cyl(.007, .007, .6, 4), C.bamboo, .08, .3, 0, { p: g, sway: 0 }); M(cyl(.012, .016, .18, 5), C.woodD, 0, .09, 0, { p: g });
