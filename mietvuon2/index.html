.sn{min-width:0}.sn b{display:block;font-family:var(--f-game);font-weight:400;font-size:18px;color:#4A2F1E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn .st{font-size:15px;font-weight:700;color:#8A5D3B;display:inline-flex;align-items:center;gap:3px}.sn .st img{width:20px;height:20px}
.btn.s1{width:48px;height:48px;padding:0;font-size:19px;display:flex;align-items:center;justify-content:center}
.btn.sall{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:6px 12px 5px;min-width:96px;height:48px;box-sizing:border-box}.btn.sall small{font-size:12px;opacity:.95}
@media (max-width:560px){ .srow{grid-template-columns:50px minmax(0,1fr) auto auto;gap:7px} .sic,.sic img{width:50px;height:50px} .sn b{font-size:16px} .sn .st{font-size:13px} .btn.s1{width:42px;height:44px} .btn.sall{min-width:80px;height:44px;padding:5px 8px} }
/* ---- thanh túi hạt ---- */
.fan{left:50%;right:auto;top:auto;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;padding:10px 10px 6px;max-width:calc(100vw - 200px);overflow-x:auto;overflow-y:hidden;animation:sbIn .26s cubic-bezier(.3,1.4,.5,1);z-index:4;border-radius:22px;scrollbar-width:thin;box-sizing:border-box}
@keyframes sbIn{0%{transform:translate(-50%,40px);opacity:0}100%{transform:translateX(-50%);opacity:1}}
.sk{appearance:none;border:0;background:none;cursor:grab;flex:none;width:78px;padding:10px 2px 3px;border-radius:16px;position:relative;font:inherit;touch-action:pan-x;transition:transform .15s,background .15s;-webkit-user-select:none;user-select:none}
.sk img{width:56px;height:56px;display:block;margin:0 auto;pointer-events:none;filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 3px 1px rgba(74,47,30,.3))}
.sk b{display:block;margin-top:2px;font-family:var(--f-game);font-weight:400;font-size:12px;color:#6B4529;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .n{position:absolute;right:4px;top:4px;min-width:26px;padding:2px 6px 1px;border-radius:999px;background:#6E9F57;color:#fff;font-family:var(--f-game);font-size:15px;line-height:1.2;box-shadow:0 0 0 2.5px #FBF7EE;box-sizing:border-box}
.sk .pr{position:absolute;right:0;top:3px;display:flex;align-items:center;gap:2px;padding:1px 6px 1px 2px;border-radius:999px;background:#FBF7EE;box-shadow:0 0 0 2px #E3BC97;font-family:var(--f-game);font-size:13px;line-height:1.3;color:#8A5D3B}.sk .pr img{width:17px;height:17px;filter:none;margin:0}
.sk.zero>img{filter:grayscale(.9) opacity(.55) drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 3px 1px rgba(74,47,30,.3))}
.sk.poor .pr{color:#C24A2E;box-shadow:0 0 0 2px #F08A6E}
.sk.on{background:#F6E3C4;transform:translateY(-6px);box-shadow:inset 0 0 0 3px #EDB940}
.sk.lock{cursor:default}.sk.lock>img{filter:brightness(0) opacity(.22)}.sk.lock b{color:#9a8a7a}.sk.lock .pr{color:#8A5D3B;font-size:12px;padding:1px 6px}
.sk.shake{animation:skSh .3s}@keyframes skSh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sktip{position:fixed;z-index:8;transform:translate(-50%,calc(-100% - 10px));background:#FBF7EE;border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 #D2A57E,0 10px 18px rgba(43,52,70,.25);color:#4A2F1E;pointer-events:none;white-space:nowrap;text-align:center}
.sktip b{display:block;font-family:var(--f-game);font-weight:400;font-size:17px;color:#6B4529}.sktip .sts{margin-top:4px}.sktip .wh{font-size:13px;font-weight:700;color:#8A5D3B;margin-top:3px}
@media (max-width:560px){ .fan{left:8px;right:80px;transform:none;max-width:none;bottom:calc(104px + env(safe-area-inset-bottom,0px));animation:none} .sk{width:66px} .sk img{width:48px;height:48px} }
#scrim{position:fixed;inset:0;z-index:3;background:rgba(43,52,70,.14);animation:scIn .2s}@keyframes scIn{0%{opacity:0}}
.sn .mkh{display:block;font-size:12px;font-weight:600;color:#9a7a5a;line-height:1.2}
#bCho{position:relative}.kb{position:absolute;top:-6px;right:-8px;font-family:var(--f-game);font-size:12px;line-height:1;color:#fff;text-shadow:none;background:#E9A23A;border-radius:999px;padding:4px 7px 3px;box-shadow:0 0 0 2px #FBF7EE;white-space:nowrap;pointer-events:none}.kb.full{background:#C24A2E;animation:kbP 1.2s ease-in-out infinite}@keyframes kbP{50%{transform:scale(1.12)}}

/* ================= v40 · lớp hoàn thiện giao diện =================
   lưới 4/8px · bo góc 12/16/20 · bóng hai lớp (gờ cứng + bóng mềm) · ánh sáng từ trên: viền trong sáng ở mép trên */
:root{--g:8px;--r1:12px;--r2:16px;--r3:20px;--hi:inset 0 1.5px 0 rgba(255,255,255,.65);--lift:0 14px 28px -10px rgba(36,44,30,.42);--ring:#6B4529}
.card{box-shadow:var(--hi),0 4px 0 var(--wood),var(--lift)}
.sheet{border-radius:var(--r3);padding:16px 20px 20px;box-shadow:var(--hi),0 5px 0 var(--wood),0 22px 44px -14px rgba(36,44,30,.5)}
.shH{margin-bottom:4px}.shH h2{line-height:1.05}
.x{width:40px;height:40px;border-radius:var(--r1);box-shadow:var(--hi),0 3px 0 #D2A57E;transition:transform .08s}.x:active{transform:translateY(2px);box-shadow:0 1px 0 #D2A57E}
.btn{min-height:40px;border-radius:var(--r1);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 4px 0 var(--woodD),0 8px 14px -4px rgba(43,52,70,.3)}
.btn.g{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 4px 0 #4F7D44,0 8px 14px -4px rgba(43,52,70,.3)}
.btn.r{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 4px 0 #8E2F1A,0 8px 14px -4px rgba(43,52,70,.3)}
.acts{gap:var(--g)}
.sub{margin-top:16px;font-size:16px;letter-spacing:.2px}
.note{border-radius:var(--r1);padding:8px 12px;line-height:1.35}
.kv{min-height:28px;margin-top:6px}.kv>span:first-child{width:112px;white-space:nowrap}
.bar{height:12px}
.kv b.sm{min-width:52px;color:#6B4529}

/* --- huy hiệu nhân vật: vòng kinh nghiệm + cấp đứng riêng --- */
.avb{margin-right:6px}
.avw{position:relative;display:block;width:72px;height:72px;filter:drop-shadow(0 4px 0 rgba(74,47,30,.55)) drop-shadow(0 10px 12px rgba(36,44,30,.28))}
.avb .avw img{position:absolute;left:7px;top:7px;width:52px;height:52px;border:3px solid #FBF7EE;box-shadow:none;border-radius:50%;background:#FBF7EE;object-fit:cover}
.xpr{position:absolute;inset:0;width:72px;height:72px;transform:rotate(-90deg);overflow:visible}
.xpr circle{fill:none;stroke-width:6}
.xpr .tr{stroke:#6B4529;stroke-width:8}
.xpr .pg{stroke:#9BD35A;stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.3,1.2,.5,1)}
.lvb{position:absolute;right:-9px;top:-5px;z-index:2;min-width:30px;height:30px;box-sizing:border-box;padding:0 6px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#FFE27A,#F2B232 55%,#D98E1E);border:2.5px solid #6B4529;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75);font-family:var(--f-game);font-size:16px;line-height:1;color:#FBF7EE;text-shadow:1.4px 0 0 #6B4529,-1.4px 0 0 #6B4529,0 1.4px 0 #6B4529,0 -1.4px 0 #6B4529,1px 1px 0 #6B4529,-1px 1px 0 #6B4529,1px -1px 0 #6B4529,-1px -1px 0 #6B4529,0 2.4px 0 #4A2F1E}
.lvb.pop{animation:lvPop .7s cubic-bezier(.3,1.8,.5,1)}@keyframes lvPop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:none}}
.avb .tg{margin-top:-6px;font-size:13px;max-width:128px;overflow:hidden;text-overflow:ellipsis;z-index:1}

/* --- ống xu: sáng, không sọc, số canh giữa --- */
.coin{min-width:0!important;height:46px;box-sizing:border-box;justify-content:center;gap:4px;padding:0 16px 0 40px!important;margin-left:24px;
  background:linear-gradient(#F8E9B8,#ECD38C)!important;border:2.5px solid #6B4529;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(176,128,40,.28),0 4px 0 #4A2F1E,var(--lift)!important}
.coin::after{display:none!important}
.coin span{font-variant-numeric:tabular-nums;font-size:24px;letter-spacing:.3px}
.coin small{font-size:14px;margin-left:1px;align-self:center;transform:translateY(2px)}
.coin canvas{left:-22px!important;width:56px!important;height:56px!important;margin-top:-28px!important;filter:drop-shadow(0 2px 0 rgba(74,47,30,.25))!important}
.coin.bump canvas{animation:cnB .35s cubic-bezier(.3,1.8,.5,1)}@keyframes cnB{50%{transform:scale(1.18) rotate(-8deg)}}
.fl.cp{font-size:17px!important}.fl.buyl{position:fixed;z-index:9;font-size:16px;animation:fl 1.1s ease-out forwards}.btn.shake{animation:skSh .3s}
#bCtr{right:max(16px,env(safe-area-inset-right,0px));width:72px}

/* --- Ngoại nổi trên nền rối: viền sticker trắng, quầng kem phía sau, bóng nói có viền + bóng đổ --- */
.ngoai .pt::before{content:"";position:absolute;left:8%;right:8%;bottom:4%;height:62%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,248,228,.95),rgba(255,244,214,.6) 55%,rgba(255,244,214,0));z-index:-1;pointer-events:none}
.ngoai .pt img{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 8px 8px rgba(36,44,30,.35))}
.ngoai p{background:#FFFCF4;border-radius:var(--r2);padding:10px 14px;font-size:16px;line-height:1.35;color:#3E2718;box-shadow:0 0 0 1.5px #D9B894,0 4px 0 1.5px #C9A27E,0 14px 22px -8px rgba(36,44,30,.45)}
.ngoai p::before{border-right-color:#FFFCF4;z-index:1}
.ngoai p::after{content:"";position:absolute;left:-11.5px;bottom:14.5px;border:10.5px solid transparent;border-right-color:#D9B894;border-left:0}
/* dải tối nhẹ sau thanh dưới và trên cho chữ, nút luôn đọc được */
.ui.bot::before,.ui.top::before{content:"";position:absolute;left:0;right:0;pointer-events:none;z-index:-1}
.ui.bot::before{bottom:0;height:210px;background:linear-gradient(to top,rgba(30,38,22,.34),rgba(30,38,22,.14) 45%,rgba(30,38,22,0))}
.ui.top::before{top:0;height:130px;background:linear-gradient(to bottom,rgba(30,38,22,.2),rgba(30,38,22,0))}
body.fanon .ui.bot{z-index:5}

/* --- thanh túi hạt: vùng an toàn, cuộn mượt có mép mờ, nhóm cây trái --- */
.fan{display:block!important;overflow:hidden!important;padding:8px 0 4px!important;border-radius:var(--r3)!important;box-shadow:var(--hi),0 4px 0 var(--wood),0 18px 36px -12px rgba(36,44,30,.5)!important;max-width:min(760px,calc(100vw - 200px))!important}
.fan[hidden]{display:none!important}
.fhd{font-family:var(--f-game);font-size:14px;color:#8A5D3B;padding:2px 16px 0}
.fsc{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding:4px 12px 2px;scroll-snap-type:x proximity;scroll-padding:0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.fsc::-webkit-scrollbar{display:none}
.fsc>*{scroll-snap-align:start}
.fsc.ovf{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent)}
.fsc.ovf.atL{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
.fsc.ovf.atR{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22px);mask-image:linear-gradient(90deg,transparent 0,#000 22px)}
.fsc.ovf.atL.atR{-webkit-mask-image:none;mask-image:none}
.fdv{flex:none;align-self:stretch;width:22px;position:relative;margin:6px 2px}
.fdv::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;border-left:2px dashed #E3C9A6}
.fdv i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font:400 11px var(--f-game);color:#B48560;background:#F1E7D6;padding:0 4px}
.sk{border-radius:var(--r2);width:86px}
.sk b{font-size:13px;letter-spacing:-.1px}
.sk.zero>img{filter:saturate(.85) drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 3px 1px rgba(74,47,30,.3))}
.sk.poor>img{filter:grayscale(.75) opacity(.6) drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff)}
.sk .pr{top:4px;right:2px;box-shadow:0 0 0 2px #EBCB8F;background:#FFFBEF}
.sk .n{top:4px;right:4px}
.sktip.drag::after{content:"";position:absolute;left:50%;bottom:-26px;width:14px;height:14px;margin-left:-7px;border-left:3.5px solid #6E9F57;border-top:3.5px solid #6E9F57;transform:rotate(45deg);animation:upA .8s ease-in-out infinite}
@keyframes upA{0%,100%{bottom:-26px;opacity:.4}50%{bottom:-14px;opacity:1}}

/* --- sổ --- */
.qlab{margin-top:10px;font-family:var(--f-game);font-size:14px;color:#C24A2E;letter-spacing:.2px}
.lus{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}.lus img{width:72px;height:72px;filter:drop-shadow(0 3px 0 rgba(74,47,30,.25))}
.bkt span{display:block}
/* --- cỏ rậm --- */
.bedc{display:grid;grid-template-columns:44px 12px 44px minmax(0,1fr) auto;align-items:center;gap:8px;margin-top:8px;padding:8px 12px 8px 8px;background:#F3EADB;border-radius:var(--r2)}
.bedc img{width:44px;height:44px;border-radius:50%;background:#FFFCF4;box-shadow:inset 0 0 0 2px #E3C9A6;filter:drop-shadow(0 2px 0 rgba(74,47,30,.3))}
.bedc .ar{font:400 20px var(--f-game);color:#B48560;text-align:center}
.bedc b{display:block;font-family:var(--f-game);font-weight:400;font-size:16px;color:#4A2F1E}.bedc div span{display:block;font-size:14px;font-weight:600;color:#8A5D3B;line-height:1.3}
.bedc .cst .st{font-size:18px}.bedc .cst.poor .st{color:#C24A2E}
/* --- cài đặt: phần thử nghiệm gập lại --- */
details.dev{margin-top:16px;border-radius:var(--r2);background:#F3EADB;padding:8px 12px 12px}
details.dev summary{cursor:pointer;font-family:var(--f-game);font-size:15px;color:#8A5D3B;list-style:none;display:flex;align-items:center;gap:8px}
details.dev summary::-webkit-details-marker{display:none}
details.dev summary::before{content:"›";display:inline-block;transition:transform .2s;font-size:18px}details.dev[open] summary::before{transform:rotate(90deg)}
.lvnow{font-family:var(--f-game);font-weight:400;color:#6B4529;align-self:center}

.cft{position:absolute;width:9px;height:6px;border-radius:2px;pointer-events:none;box-shadow:0 1px 0 rgba(74,47,30,.25)}
.rc{font-family:ui-monospace,monospace;letter-spacing:.5px;-webkit-user-select:all;user-select:all}
.rin{font:600 15px ui-monospace,monospace;text-transform:uppercase;padding:9px 12px;border:2.5px solid #8A5D3B;border-radius:12px;background:#FBF7EE;color:#4A2F1E;min-width:0;flex:1 1 220px;-webkit-user-select:text;user-select:text}
@media (max-width:760px){ body.bookon .ui.top,body.bookon #bCtr,body.bookon .ui.bot .row,body.bookon #tray{visibility:hidden} }
/* --- kéo hạt trên điện thoại: dọn màn hình --- */
#fan,.ngoai,#seedbar{transition:opacity .15s}
body.drag #fan,body.drag .ngoai,body.drag #seedbar{opacity:0!important;pointer-events:none!important}
@media (max-width:560px){ .seedbar{top:calc(112px + env(safe-area-inset-top,0px));padding:4px 6px 4px 4px;gap:6px;font-size:13px;line-height:1.2;max-width:calc(100vw - 32px)} .seedbar img{width:30px;height:30px} .seedbar .btn{min-height:32px;padding:5px 10px 4px;font-size:13px} }
/* --- chợ chia mục --- */
.seg{display:flex;gap:4px;margin:6px 0 4px;padding:4px;background:#EDE3D1;border-radius:14px;position:sticky;top:-16px;z-index:2}
.sg{appearance:none;border:0;cursor:pointer;flex:1;min-height:40px;border-radius:11px;background:none;font:400 15px var(--f-game);color:#8A5D3B;display:flex;align-items:center;justify-content:center;gap:6px}
.sg.on{background:#FBF7EE;color:#4A2F1E;box-shadow:0 2px 0 #D9C3A2}
.sg i{font-style:normal;min-width:20px;padding:1px 6px;border-radius:999px;background:#6E9F57;color:#fff;font-size:12px;line-height:1.4}
.tk small.qg{color:#8A5D3B}.tk small.qg.ok{color:#4F7D44}
.kb.new{background:#C24A2E;min-width:20px;text-align:center;left:auto;right:-6px;animation:kbP 1.2s ease-in-out infinite}
/* --- ghé vườn --- */
.vcard{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:8px;padding:8px 10px 8px 8px;background:#FBF7EE;border-radius:var(--r2);box-shadow:0 3px 0 #E3D3BC}
.vcard img{width:56px;height:56px}.vcard b{display:block;font-family:var(--f-game);font-weight:400;font-size:17px;color:#4A2F1E}.vcard span{display:block;font-size:14px;font-weight:600;color:#8A5D3B;line-height:1.3}
.vcard.lk{opacity:.75}.vcard.lk img{filter:grayscale(.6)}
body.visit .ui.bot .row,body.visit #tray,body.visit .top .coin,body.visit #avb,body.visit #fan{display:none!important}
.vbar{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:var(--r3);max-width:calc(100vw - 32px);box-sizing:border-box}
.vbar b{display:block;font-family:var(--f-game);font-weight:400;font-size:18px;color:#4A2F1E;white-space:nowrap}.vbar .btn{white-space:nowrap;flex:none}body.visit #bCtr{right:max(16px,env(safe-area-inset-right,0px))}.vbar span{display:block;font-size:13px;font-weight:600;color:#8A5D3B}
@media (max-width:560px){ .vcard{grid-template-columns:48px minmax(0,1fr)} .vcard img{width:48px;height:48px} .vcard .btn,.vcard .lockb{grid-column:1/-1;justify-self:end} body.visit .clock{display:none} .vbar{top:calc(10px + env(safe-area-inset-top,0px));left:16px;right:16px;transform:none;max-width:none;justify-content:space-between} .vbar b{font-size:16px} }
/* --- bếp Ngoại --- */
.pots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pot{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:64px;padding:6px 8px;background:#F3EADB;border-radius:var(--r2);box-sizing:border-box}

{ const g = new T.PlaneGeometry(90, 90, 90, 90).toNonIndexed(); g.rotateX(-Math.PI / 2); const p = g.attributes.position, col = [], tmp = new T.Color();

  const pool = TASKT.slice(), list = []; while (list.length < 5 && pool.length) list.push(pool.splice(Math.floor(r() * pool.length), 1)[0](r)); const bk = ['cai', 'hanh', 'ot', 'bap', 'cachua', 'khoqua'][Math.floor(r() * 6)];
  ST.tasks = { day: dk, list: list.map(x => ({ ...x, have: 0, done: false })), bonus: bk, got: false }; }
function bump(t, n = 1, k){ ensureTasks(); for (const x of ST.tasks.list){ if (x.done || x.t !== t || (x.k && x.k !== k)) continue; x.have = Math.min(x.need, x.have + n);
    if (x.have >= x.need){ x.done = true; setTimeout(() => gainXP(5), 0); if (x.rw[0] === 'coin'){ ST.xu += x.rw[1]; coinPop(`+${x.rw[1]} xu · thưởng việc`, '#9fd36a'); } else ST.inv.rom = (ST.inv.rom || 0) + x.rw[1]; hud(); say(`Xong việc "${x.txt.toLowerCase()}" rồi, Ngoại thưởng ${x.rw[1]} ${x.rw[0] === 'coin' ? 'xu' : 'bó rơm'} nè.`, 'vui'); } }
  if (!ST.tasks.got && ST.tasks.list.every(x => x.done)){ ST.tasks.got = true; ST.seeds[ST.tasks.bonus] = (ST.seeds[ST.tasks.bonus] || 0) + 1; say(`Giỏi quá con! Xong hết việc hôm nay, Ngoại cho thêm 1 bao hạt ${CROPS[ST.tasks.bonus].name.toLowerCase()}.`, 'nhay', { idle: true }); }

function oddDefs(){ return { sau: { lv: 3, max: 2, every: 22 * 60, name: 'Bắt sâu' }, lucbinh: { lv: 2, max: 2, every: 35 * 60, name: 'Vớt lục bình' }, la: { lv: 2, max: 2, every: 40 * 60, name: 'Quét lá' }, cui: { lv: 4, max: 3, every: 15 * 60, name: 'Nhặt củi' } }; }
