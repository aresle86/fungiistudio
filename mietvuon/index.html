  S.sel = null; S.selCoop = kind !== 'free'; afterChange(); }
function steal(id){ const owner = S.view, f = vf(), m = me(), t = plotState(f, id), pl = plotById(id), log = (m.steal || {})[owner], n = log && log.d === today() ? log.n : 0;

/* mỗi mùa chăm một kiểu: khô thì mau khát, mưa thì cỏ lên mau mà cà ớt dễ úng, nước nổi hàng sát mương ngập nhưng có phù sa, Tết hoa lên đẹp */

const soggy = (f, id, k, mOn) => { const s = SZ(); return (s.flood && rowOf(id) === 3 && k !== 'raumuong') || (s.wet && s.wet.includes(k) && !mOn && WX().k === 'mua'); };
function season(){ const m = new Date().getMonth() + 1; if (m === 1 || m === 2) return { k: 'tet', n: 'Mùa Tết', rain: .06 }; if (m >= 9 && m <= 11) return { k: 'nuocnoi', n: 'Mùa nước nổi', rain: .4 }; if (m >= 5 && m <= 8) return { k: 'mua', n: 'Mùa mưa', rain: .45 }; return { k: 'kho', n: 'Mùa khô', rain: .07 }; }
const WBLK = 2 * HR, wBlock = t => Math.floor(t / WBLK);

/* ---------- chợ: giá theo ngày, phiên chợ cuối tuần, bán nhiều thì rớt giá ---------- */

/* ---------- việc hôm nay ---------- */
const DAILY = { water: [6, 'Tưới 6 luống'], harvest: [4, 'Thu hoạch 4 lần'], plant: [3, 'Gieo 3 luống'], mulch: [2, 'Phủ rơm 2 luống'], cut: [2, 'Cắt cỏ 2 luống'], sell: [3, 'Bán ở chợ 3 lần'], order: [1, 'Giao 1 đơn cho ghe'], cook: [1, 'Nấu 1 món'], collect: [1, 'Lượm trứng gà'], visit: [1, 'Ghé vườn bạn'] };
function ensureDaily(){ const f = me(); if (!f || !isHome() || (f.step || 0) < 13) return; if (f.daily && f.daily.d === today()) return;
  seed(f.owner + today()); const lv = level(f.xp), crops = Object.keys(CROPS3).filter(k => k !== 'raumuong' && CROPS3[k].lvl <= lv), pool = [...crops.slice(-3).map(k => 'plant_' + k), ...Object.keys(DAILY)].filter(k => (k !== 'mulch' || PLOTS.filter(p => { const t = plotState(f, p.id); return !t.mulch && (t.crop || t.st === 'bare'); }).length >= 2) && (k !== 'collect' || f.hens > 0) && (k !== 'visit' || Object.keys(S.farms).length > 1)), ks = [];
  while (ks.length < 3 && pool.length) ks.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  const base = {}, ns = {}; for (const k of ks){ base[k] = (f.cnt || {})[k] || 0; ns[k] = dailyN(k, lv); } write(S.uid, { daily: { d: today(), ks: ks.join('|'), base, ns, got: { a: 0 }, chest: 0 } }); }

const dailyReady = f => (curQuest(f)?.done ? 1 : 0) + dailyList(f).filter(x => x.done && !x.got).length + (dailyList(f).length && dailyList(f).every(x => x.got) && !f.daily.chest ? 1 : 0);
function claimDaily(i, btn){ const f = me(), x = dailyList(f)[i]; if (!x || !x.done || x.got) return; const lv = level(f.xp), xu = 4 + lv;
  write(S.uid, { xu: (f.xu || 0) + xu, daily: { got: { ['g' + i]: 1 } } }); gainXP(4); sfx('coin'); flyCoins(btn, 6); toast(`Xong việc "${x.t}" · +${xu} xu`); afterChange(); }
function openChest(btn){ const f = me(); if (!dailyList(f).every(x => x.got) || f.daily.chest) return; const lv = level(f.xp); seed(f.owner + today() + 'c');
  const vs = Object.keys(VARS).filter(k => CROPS3[k].lvl <= lv), gift = null, xu = 10 + lv * 2; const extra = rnd() < .5 ? { rom: (f.inv.rom || 0) + 2 } : { egg: (f.inv.egg || 0) + 1 };

    h = head('Việc hôm nay') + `<div class="sec">${esc(season().n.toUpperCase())} · ${esc(WX().n.toUpperCase())}</div><div class="it lesson"><span class="grow">${esc(SZ().say)}<div class="sub">Hợp mùa: ${SZ().fav.map(k => esc(CROPS3[k].name.toLowerCase())).join(', ')}${SZ().slow.length ? ` · Trái mùa: ${SZ().slow.map(k => esc(CROPS3[k].name.toLowerCase())).join(', ')}` : ''}</div></span></div><div class="sec">NGOẠI DẠY · BÀI ${Math.min(QUESTS.length, (f.qi || 0) + 1)}/${QUESTS.length}</div>${qh}<div class="sec">SẮP TỚI</div><div class="rows">${up.map(([ms, txt]) => `<div class="it"><span class="grow">${esc(txt)}</span><b>${mmss(ms)}</b></div>`).join('')}</div><div class="sec">VIỆC NGOẠI NHỜ</div><p class="note" style="margin-top:0">Mỗi ngày Ngoại nhờ 3 việc mới, qua nửa đêm là đổi. Cấp càng cao việc càng nặng, quà cũng lớn hơn. Xong cả 3 thì mở rương.</p><div class="rows">${L.map(x => `<div class="it"><img class="px" alt="" src="${mIcon('viec')}"><span class="grow">${esc(x.t)}<div class="qbar"><i style="width:${Math.round(x.have / x.n * 100)}%"></i><span>${x.have}/${x.n}</span></div></span>${x.got ? '<span class="sub">đã nhận ✓</span>' : `<button class="btn p" data-claim="${x.i}" ${x.done ? '' : 'disabled'}>nhận</button>`}</div>`).join('')}

  else if (S.panel === 'so' && S.soTab === 'loi'){ const sn = f.seen || {}, bk = f.book || {}, tk = Object.keys(TIPS), got = tk.filter(k => sn[k]).length;

  else if (S.panel === 'so'){ const bk = me().book || {}; const keys = Object.keys(CROPS3).flatMap(k => VARS[k] ? [k, k + '_q'] : [k]); const got = keys.filter(k => bk[k]).length;
    h = head(`Sổ giống · ${got}/${keys.length}`) + soTabs() + `<p class="note" style="margin-top:0">Thu hoạch lần đầu là ghi vào sổ. Giống quý chỉ rơi ra từ cây được chăm khoẻ.</p><div class="book">${keys.map(k => { const has = bk[k], v = isVar(k), b = baseKey(k);
      return `<div class="card2 ${v ? 'q' : ''} ${has ? '' : 'no'}"><img class="px" alt="" src="${cropIcon(k)}"><b>${has ? esc(seedName(k)) : '???'}</b><span>${has ? (v ? 'giống quý · ' + TRAIT_N[TRAIT[b]] : `${CROPS3[b].y} ${unitOf(b)}/lứa · ${CROPS3[b].price} xu`) : v ? esc(VARS[b].hint) : 'mua hạt ở chợ, cấp ' + CROPS3[b].lvl}</span>${has ? `<i>×${has}</i>` : ''}</div>`; }).join('')}</div>`; }
  const op = el.querySelector('.panel'), keep = op && el.dataset.p === S.panel + (S.soTab || '') + (S.choTab || '') ? op.scrollTop : 0; el.dataset.p = S.panel + (S.soTab || '') + (S.choTab || '');
  el.innerHTML = `<div class="veil" id="veil"><div class="panel" role="dialog" aria-label="${S.panel}">${h}</div></div>`; if (keep) el.querySelector('.panel').scrollTop = keep;
  el.querySelectorAll('[data-fill]').forEach(b => b.onclick = () => fillOrder(b.dataset.fill, b));
  el.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => skipOrder(b.dataset.skip));
  $('#px').onclick = () => { S.panel = null; render(); }; $('#veil').onclick = e => { if (e.target.id === 'veil'){ S.panel = null; render(); } };
  el.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => { const k = b.dataset.sell, n = +b.dataset.n, fm = me(), have = (fm.inv.prod || {})[k] || 0, q = Math.min(n, have); if (!q) return;
    const tot = sellTotal(fm, k, q), sd = fm.sold && fm.sold.d === today() ? fm.sold : Object.fromEntries(Object.keys(fm.sold || {}).filter(x => x !== 'd').map(x => [x, 0])); write(S.uid, { xu: (fm.xu || 0) + tot, inv: { prod: { [k]: have - q } }, sold: { ...sd, d: today(), [k]: (sd[k] || 0) + q } }); bump('sell'); gainXP(1); sfx('coin'); flyCoins(b, Math.min(6, q)); toast(`Bán ${q} ${prodName(k)}, được ${tot} xu.`); afterChange(); });
  el.querySelectorAll('[data-fair]').forEach(b => b.onclick = () => { const fm = me(), k = b.dataset.fair, pr = FAIR_PRICE; if ((fm.xu || 0) < pr || (fm.fair || {}).d === today()) return; write(S.uid, { xu: fm.xu - pr, inv: { seed: { [k]: ((fm.inv.seed || {})[k] || 0) + 1 } }, fair: { d: today() } }); sfx('level'); flyIcon(cropIcon(k), 200, 120, '[data-p="kho"]'); toast(`Mua được 1 hạt ${VARS[baseKey(k)].name} ở phiên chợ.`); afterChange(); });
  el.querySelectorAll('[data-egg]').forEach(b => b.onclick = () => { const n = +b.dataset.egg, fm = me(); if ((fm.xu || 0) < n * 5) return; write(S.uid, { xu: fm.xu - n * 5, inv: { egg: (fm.inv.egg || 0) + n } }); sfx('coin'); toast(`Mua ${n} trứng giống. Đóng chợ rồi chạm chuồng gà cho gà mẹ ấp nghen.`); afterChange(); });
  el.querySelectorAll('[data-rom]').forEach(b => b.onclick = () => { const fm = me(); if ((fm.xu || 0) < ROM_PRICE) return; write(S.uid, { xu: fm.xu - ROM_PRICE, inv: { rom: (fm.inv.rom || 0) + 1 } }); sfx('coin'); afterChange(); });
  el.querySelectorAll('[data-pan]').forEach(b => b.onclick = () => { const k = b.dataset.pan, fm = me(), p = PANTRY[k]; if ((fm.xu || 0) < p.price) return; write(S.uid, { xu: fm.xu - p.price, inv: { pantry: { [k]: ((fm.inv.pantry || {})[k] || 0) + 1 } } }); sfx('coin'); afterChange(); });
  el.querySelectorAll('[data-seed]').forEach(b => b.onclick = () => { const k = b.dataset.seed, q = +b.dataset.q || 1, fm = me(), c = CROPS3[k]; if ((fm.xu || 0) < c.seed * q) return; write(S.uid, { xu: fm.xu - c.seed * q, inv: { seed: { [k]: ((fm.inv.seed || {})[k] || 0) + q } } }); sfx('coin'); toast(`Mua ${q} hạt ${c.name.toLowerCase()}.`); afterChange(); });
  el.querySelectorAll('[data-cook]').forEach(b => b.onclick = () => { const r = RECIPES.find(x => x.id === b.dataset.cook), fm = me(), prod = clone(fm.inv.prod || {}), pantry = clone(fm.inv.pantry || {}); if (Object.entries(r.need).some(([k, n]) => haveOf(fm, k) < n)) return; for (const k in r.need){ if (PANTRY[k]) pantry[k] -= r.need[k]; else prod[k] -= r.need[k]; }
    const first = !((fm.cnt || {}).cook); if (!first) prod[r.id] = (prod[r.id] || 0) + 1;
    write(S.uid, { inv: { prod, pantry } }); bump('cook'); sfx('step'); gainXP(r.xp); boom(200, 140);
    if (first) toast(`Hai bà cháu ăn cơm với ${r.name}. Ngoại khen con nấu khéo!`); else { flyIcon(mIcon(r.id), 200, 140, '[data-p="kho"]'); toast(`${r.name} cất vô kho rồi. Chợ mua ${prodPrice(r.id)} xu, ghe hay đặt món này.`); tip('dish'); } afterChange(); });
  const fb = $('#fast'); if (fb) fb.onclick = () => { S.fast = !S.fast; try { localStorage.setItem(LS_KEY + '-fast', S.fast ? '1' : '0'); } catch (e) {} render(); drawFrame(); };
  el.querySelectorAll('[data-ctab]').forEach(b => b.onclick = () => { S.choTab = b.dataset.ctab; sfx('tap'); renderPanel(); });
  el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.soTab = b.dataset.tab; sfx('tap'); renderPanel(); });
  el.querySelectorAll('[data-req]').forEach(b => b.onclick = () => askSeed(b.dataset.req));
  el.querySelectorAll('[data-give]').forEach(b => b.onclick = () => giveSeed(b.dataset.give));
  const ku2 = $('#khoUp'); if (ku2) ku2.onclick = () => { const fm = me(), kc = khoCap(fm), cost = KHO_COST[(kc - KHO0) / KHO_STEP]; if ((fm.xu || 0) < cost || kc >= KHO_MAX) return; write(S.uid, { xu: fm.xu - cost, kho: kc + KHO_STEP }); sfx('level'); flash(); toast(`Kho rộng thêm, chứa được ${kc + KHO_STEP} món.`); afterChange(); };
  const cb = $('#cast'); if (cb) cb.onclick = cast; const jb = $('#jerk'); if (jb) jb.onpointerdown = e => { e.preventDefault(); jerk(); };
  if (S.panel === 'cau'){ fishSync(); if (!FISH.raf) FISH.raf = requestAnimationFrame(pondLoop); }
  el.querySelectorAll('[data-build]').forEach(b => b.onclick = () => build(b.dataset.build, b));
  const qc = $('#qclaim'); if (qc) qc.onclick = () => claimQuest(qc);
  const vo = $('#veok'); if (vo) vo.onclick = () => { S.panel = null; S.away = null; sfx('step'); render(); };
  el.querySelectorAll('[data-eggback]').forEach(b => b.onclick = () => { const fm = me(), q = Math.min(+b.dataset.eggback, fm.inv.egg || 0); if (!q) return; write(S.uid, { xu: (fm.xu || 0) + q * EGG_BACK, inv: { egg: fm.inv.egg - q } }); sfx('coin'); flyCoins(b, Math.min(5, q)); toast(`Bán lại ${q} trứng giống, được ${q * EGG_BACK} xu.`); afterChange(); });
  const ee = $('#eggEat'); if (ee) ee.onclick = () => { const fm = me(); if (!(fm.inv.egg > 0) || !khoRoom(fm, 1)) return; write(S.uid, { inv: { egg: fm.inv.egg - 1, prod: { trung: ((fm.inv.prod || {}).trung || 0) + 1 } } }); sfx('tap'); toast('Một trứng giống đổi qua trứng ăn, nấu được món trứng.'); afterChange(); };
  const tn = $('#toNest'); if (tn) tn.onclick = () => { S.panel = null; render(); coopAct('put'); };
  el.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => claimDaily(+b.dataset.claim, b));
  const ch = $('#chest'); if (ch) ch.onclick = () => openChest(ch);
  const cp = $('#copy'); if (cp) cp.onclick = () => { navigator.clipboard?.writeText(f.code).then(() => toast('Đã chép mã xóm.'), () => {}); bump('xom'); afterChange(); };
  const nf2 = $('#namef'); if (nf2) nf2.onsubmit = e => { e.preventDefault(); const v = $('#vname').value.trim().slice(0, 24); if (!v) return; write(S.uid, { name: v }); toast(`Đổi tên thành "${v}".`); afterChange(); };
  const rc = $('#rcopy'); if (rc) rc.onclick = () => navigator.clipboard?.writeText(window.MVF.recovery()).then(() => toast('Đã chép mã khôi phục. Cất kỹ nghen.'), () => {});
  const rf = $('#restf'); if (rf) rf.onsubmit = e => { e.preventDefault(); if (window.MVF.restore($('#rcode').value)){ toast('Đang mở vườn…'); setTimeout(() => location.reload(), 600); } else toast('Mã không đúng.'); };
  const af = $('#addf'); if (af && window.MV_FUNGII && S.mode === 'remote') af.onsubmit = async e => { e.preventDefault(); const code = $('#cin').value.trim().toUpperCase(); if (!code) return; if (code === (me().code || '')){ $('#amsg').textContent = 'Mã của chính con mà.'; return; }
      $('#amsg').textContent = 'Đang tìm…'; try { const id = await window.MVF.befriend(code); if (!id){ $('#amsg').textContent = 'Không thấy mã này.'; return; } bump('xom'); toast(`Kết bạn với ${S.farms[id]?.name || 'hàng xóm mới'}.`); addNews('có hàng xóm mới'); afterChange(); } catch (er){ $('#amsg').textContent = 'Chưa kết bạn được, thử lại nghen.'; } };
  else if (af) af.onsubmit = e => { e.preventDefault(); const code = $('#cin').value.trim().toUpperCase(), id = Object.keys(S.farms).find(k => S.farms[k]?.code === code);
    if (!id){ $('#amsg').textContent = 'Không thấy mã này.'; return; } if (id === S.uid){ $('#amsg').textContent = 'Mã của chính con mà.'; return; } write(S.uid, { friends: { [id]: true } }); toast(`Kết bạn với ${S.farms[id].name}.`); afterChange(); };
  el.querySelectorAll('[data-visit]').forEach(b => b.onclick = () => { S.view = b.dataset.visit; if (b.dataset.visit !== S.uid) bump('visit'); S.panel = null; S.sel = null; render(); drawFrame(); }); }

/* ---------- boot ---------- */
async function boot(){
  buildWorld(); renderHits(); initPan();  loadLocal(); enterStep(me()); render(); sizeCanvas();
  requestAnimationFrame(loop); window.addEventListener('resize', () => { sizeCanvas(); renderFinger(); });
  $('#stage').addEventListener('click', e => { if (e.target.closest('.act,.dlg,.hud-br,.veil,.hit,.visit,.zoomb,.mk')) return; if (S.selHeap){ S.selHeap = false; render(); } if (S.sel || S.selCoop){ S.sel = null; S.selCoop = false; render(); drawFrame(); } });
  setInterval(() => { if (!S.panel && TIPQ.length && !document.querySelector('.tipc')) showTip(TIPQ.shift()); checkReturn(); heartbeat(); gardenLife(); demoNeighbour(); renderBulk(); renderNext(); ensureOrders(); ensureDaily(); growChicks(); checkStep(); renderAct(); renderDlg(); renderFinger(); renderMarks(); ambient(); if (RM) drawFrame(); }, 1000);
  window.addEventListener('pointerdown', () => { if (SND.on) audio(); }, { once: true });
  const c = window.claude; if (!c || !c.use){ S.ready = true; return; } let db, user;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { S.ready = true; return; } if (!db || !user){ S.ready = true; return; }
  const uid = await user.id(); if (!uid){ S.ready = true; return; }
  S.mode = 'remote'; S.db = db; S.user = user; S.uid = uid; S.view = uid; S.farms = {}; render();
  const canWrite = await user.can('data.write');
  try { const snap = await db.doc('farms/' + uid).get();
    if (!snap.exists || snap.data()?.v !== 4){ if (canWrite === false) S.readOnly = true; else { const nf = newFarm(uid); if (window.MV_FUNGII) nf.name = 'Vườn ' + nf.code; try { await db.doc('farms/' + uid).set(nf); S.farms[uid] = nf; enterStep(nf); } catch (e) { S.readOnly = true; } } }
  } catch (e) { S.readOnly = true; }
  db.collection('farms').onSnapshot(qs => { for (const ch of qs.docChanges()){ if (ch.type === 'removed') delete S.farms[ch.doc.id]; else { const d = clone(ch.doc.data()); if (!d || d.v !== 4) continue; if (busy(ch.doc.id) && S.farms[ch.doc.id]){ LATE[ch.doc.id] = d; continue; } delete LATE[ch.doc.id]; S.farms[ch.doc.id] = norm(d); } }
      if (!S.farms[S.view]) S.view = S.farms[S.uid] ? S.uid : Object.keys(S.farms)[0] || S.uid; if (S.farms[S.uid]) S.ready = true; render(); drawFrame(); },
    () => toast('Mất kết nối với xóm. Tải lại trang nghen.'));
}
boot();
</script>
