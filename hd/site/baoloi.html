<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Quản trị Miệt Vườn</title>
<style>
:root{--bg:#F5EEDF;--card:#FFFBF2;--ink:#3E2A1C;--mute:#7A6249;--line:#E3D3BC;--go:#5E8F48;--warn:#B8452A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}button{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}button[aria-pressed=true]{background:var(--go);border-color:var(--go);color:#fff}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.c.done{opacity:.55}.h{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}.h b{font-size:17px}.k{font-size:14px;color:var(--mute)}.m{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bad{color:var(--warn);font-weight:600}
img{max-width:100%;max-height:360px;border-radius:8px;display:block;margin:8px 0;cursor:zoom-in}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#F3EADB;padding:8px;border-radius:8px;margin:8px 0}details{margin:6px 0;font-size:14px}summary{cursor:pointer;color:var(--mute);min-height:28px}

.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.kp b{display:block;font-size:24px}.kp span{font-size:13px;color:var(--mute)}
.bars{display:grid;grid-template-columns:60px 1fr 56px;gap:4px 8px;align-items:center;font-size:13px}.bar{height:14px;display:flex;border-radius:4px;overflow:hidden;background:#F1E6D3}.bar i{display:block;height:100%}.i1{background:#5E8F48}.i2{background:#D8A03A}.lg{display:flex;gap:14px;font-size:13px;color:var(--mute);margin:4px 0 8px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}td.n,th.n{text-align:right}.tw{overflow-x:auto}.t{color:var(--mute);font-style:italic}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:#fff;margin:8px 0}
</style></head><body><main><h1>Quản trị Miệt Vườn</h1><div id="a"></div></main>
<script>
const SB={url:'https://zgfanxtjdvioxpgpbcke.supabase.co',key:'sb_publishable_C9yQE4moNWh6YPf6Oofdjg_hHrutuok'},A=document.getElementById('a');
let KEY='',TAB='stats',D=null,SHOWDONE=false,ST=null,SHOWTEST=false;try{KEY=localStorage.getItem('mv-bl-key')||''}catch(e){}
const KN={ket:'Kẹt, không chơi được',matdo:'Mất đồ, mất xu',hinh:'Hình lỗi',gopy:'Góp ý'};
const rpc=async(f,b)=>{const r=await fetch(`${SB.url}/rest/v1/rpc/${f}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(b)});const t=await r.text();if(!r.ok)throw new Error(/denied/.test(t)?'denied':'net');return t?JSON.parse(t):null};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=s=>new Date(s).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dev=m=>{if(!m)return '';const u=m.ua||'';const o=/iPhone|iPad/.test(u)?(u.match(/iPhone|iPad/)[0]+' iOS '+((u.match(/OS (\d+)/)||[])[1]||'')):/Android/.test(u)?'Android '+((u.match(/Android (\d+)/)||[])[1]||''):/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':'Máy khác';return `${o} · ${m.w}×${m.h}`};
function login(msg){A.innerHTML=`<div class="c"><label for="k">Khóa quản trị</label><input id="k" type="password" autocomplete="off"><button id="go">Mở</button>${msg?`<p class="bad">${msg}</p>`:''}</div>`;document.getElementById('go').onclick=()=>{KEY=document.getElementById('k').value.trim();load()}}
async function load(){A.innerHTML='<p class="k">Đang tải…</p>';try{D=await rpc('mv2_admin_list',{p_key:KEY});try{localStorage.setItem('mv-bl-key',KEY)}catch(e){}draw()}catch(e){if(e.message==='denied'){try{localStorage.removeItem('mv-bl-key')}catch(er){}login('Khóa không đúng.')}else A.innerHTML=`<p class="bad">Không tải được, kiểm tra mạng.</p><button onclick="load()">Thử lại</button>`}}
function draw(){const R=D.reports||[],E=D.errs||[],nr=R.filter(x=>!x.done).length,ne=E.filter(x=>!x.done).length;const L=(TAB==='reports'?R:E).filter(x=>SHOWDONE||!x.done);
const tabs=`<div class="tabs"><button data-t="stats" aria-pressed="${TAB==='stats'}">Người chơi</button><button data-t="reports" aria-pressed="${TAB==='reports'}">Người chơi báo (${nr})</button><button data-t="errs" aria-pressed="${TAB==='errs'}">Lỗi tự ghi (${ne})</button>${TAB==='stats'?`<button id="st" aria-pressed="${SHOWTEST}">Hiện vườn thử</button>`:`<button id="sd" aria-pressed="${SHOWDONE}">Hiện đã xử lý</button>`}<button id="rl">Tải lại</button></div>`;
if(TAB==='stats'){A.innerHTML=tabs+(ST?stats(ST):'<p class="k">Đang tải số liệu…</p>');if(!ST)loadStats();return}
A.innerHTML=tabs+(L.length?L.map(TAB==='reports'?rc:ec).join(''):'<p class="k">Chưa có gì mới.</p>');}
async function loadStats(){try{ST=await rpc('mv2_admin_stats',{p_key:KEY,p_days:30,p_hide_test:!SHOWTEST});}catch(e){ST={err:1}}if(TAB==='stats')draw()}
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'–',dd=s=>{const d=new Date(s+'T00:00:00');return d.getDate()+'/'+(d.getMonth()+1)};
const STEPN={start:'Vào game',seed1:'Gieo hạt đầu',water1:'Tưới đầu',harvest1:'Hái lần đầu',sell1:'Bán lần đầu',order1:'Giao đơn đầu',visit1:'Ghé vườn bạn',lv2:'Cấp 2',lv3:'Cấp 3',lv4:'Cấp 4',lv5:'Cấp 5',lv7:'Cấp 7',lv10:'Cấp 10',lv12:'Cấp 12',lv15:'Cấp 15',lv18:'Cấp 18',lv20:'Cấp 20'};
function stats(S){if(S.err)return '<p class="bad">Không tải được số liệu.</p>';const today=new Date(Date.now()+7*36e5).toISOString().slice(0,10),act=S.active_by_day||[],tod=act.find(x=>x.day===today),R=S.retention||[],rk=k=>R.find(x=>x.k===k)||{eligible:0,back:0};
 const days=[...new Set([...(S.new_by_day||[]).map(x=>x.day),...act.map(x=>x.day)])].sort(),nb=Object.fromEntries((S.new_by_day||[]).map(x=>[x.day,x.n])),ab=Object.fromEntries(act.map(x=>[x.day,x])),mx=Math.max(1,...days.map(d=>Math.max(nb[d]||0,(ab[d]||{}).players||0)));
 let h=`<div class="kp"><div><b>${S.total_farms}</b><span>vườn${SHOWTEST?' (kể cả vườn thử)':' thật'}${SHOWTEST?'':` · ${S.test_farms} vườn thử ẩn`}</span></div><div><b>${tod?tod.players:0}</b><span>người chơi hôm nay</span></div>`+[1,3,7].map(k=>{const x=rk(k);return `<div><b>${pct(x.back,x.eligible)}</b><span>quay lại sau ${k} ngày (${x.back}/${x.eligible})</span></div>`}).join('')+`</div>`;
 h+=`<div class="c"><b>Mỗi ngày</b><div class="lg"><span><i class="i2"></i>vườn mới</span><span><i class="i1"></i>người chơi (đậm: quay lại)</span></div><div class="bars">`+days.map(d=>{const a=ab[d]||{players:0,back:0},n=nb[d]||0;return `<span>${dd(d)}</span><div><div class="bar" title="${n} vườn mới"><i class="i2" style="width:${n/mx*100}%"></i></div><div class="bar" style="margin-top:2px" title="${a.players} người chơi, ${a.back} quay lại"><i class="i1" style="width:${a.back/mx*100}%"></i><i class="i1" style="width:${(a.players-a.back)/mx*100}%;opacity:.45"></i></div></div><span class="k">+${n} · ${a.players}</span>`}).join('')+`</div><p class="k">Cột vàng: vườn mới tạo. Cột xanh: số vườn có mở game trong ngày; phần đậm là vườn tạo từ ngày trước, quay lại chơi. Nhật ký ngày chỉ có từ 31/10.</p></div>`;
 const hs=S.days_hist||[];h+=`<div class="c"><b>Số ngày đã chơi</b><table><tr><th>Số ngày</th><th class="n">Số vườn</th></tr>${hs.map(x=>`<tr><td>${x.ndays} ngày</td><td class="n">${x.n}</td></tr>`).join('')}</table></div>`;
 const F=Object.fromEntries((S.funnel||[]).map(x=>[x.step,x.n])),st=F.start||1;h+=`<div class="c"><b>Người chơi đi tới đâu</b><table><tr><th>Bước</th><th class="n">Số vườn</th><th class="n">So với vào game</th></tr>${Object.keys(STEPN).filter(k=>F[k]!=null).map(k=>`<tr><td>${STEPN[k]}</td><td class="n">${F[k]}</td><td class="n">${pct(F[k],st)}</td></tr>`).join('')}</table></div>`;
 h+=`<div class="c"><b>Từng vườn</b><div class="tw"><table><tr><th>Người · vườn</th><th class="n">Cấp</th><th class="n">Ngày chơi</th><th class="n">Lần mở</th><th class="n">Phút</th><th>Bắt đầu</th><th>Gần nhất</th></tr>${(S.farms||[]).map(x=>`<tr${x.test?' class="t"':''}><td>${esc(x.name)} · ${esc(x.garden)}${x.test?' (thử)':''}</td><td class="n">${x.lv}</td><td class="n">${x.ndays||0}</td><td class="n">${x.ses||0}</td><td class="n">${x.mins||0}</td><td>${dd(x.created_at.slice(0,10))}</td><td>${x.last_day?dd(x.last_day):'–'}</td></tr>`).join('')}</table></div></div>`;
 return h}
const rc=x=>{const m=x.meta||{};return `<div class="c${x.done?' done':''}"><div class="h"><b>${esc(KN[x.kind]||x.kind)}</b><span class="k">${when(x.created_at)}</span></div><div class="k">${esc(x.code||'Không rõ vườn')}${x.verified?'':' · chưa xác thực'} · cấp ${esc(m.lv)} · ${esc(m.xu)} xu · ${esc(m.build)} · ${esc(dev(m))}</div>${x.msg?`<div class="m">${esc(x.msg)}</div>`:''}${x.shot&&/^data:image\/jpeg;base64,/.test(x.shot)?`<img src="${x.shot}" alt="Ảnh người chơi gửi">`:''}<details><summary>Chi tiết máy</summary><pre>${esc(JSON.stringify(m,null,1))}</pre></details><button data-d="reports" data-i="${x.id}" data-v="${!x.done}">${x.done?'Mở lại':'Đã xử lý'}</button></div>`};
const ec=x=>`<div class="c${x.done?' done':''}"><div class="h"><b>${esc(x.msg)}</b><span class="k">${when(x.last_at)}</span></div><div class="k"><span class="bad">${x.n} lần</span> · đầu tiên ${when(x.first_at)} · ${esc(x.build)} · ${esc(dev(x.meta))}</div>${x.stack?`<details><summary>Dấu vết</summary><pre>${esc(x.stack)}</pre></details>`:''}<button data-d="errs" data-i="${esc(x.sig)}" data-v="${!x.done}">${x.done?'Mở lại':'Đã xử lý'}</button></div>`;
A.addEventListener('click',async e=>{const b=e.target.closest('button,img');if(!b)return;if(b.tagName==='IMG'){window.open().document.write(`<img src="${b.src}" style="max-width:100%">`);return}if(b.dataset.t){TAB=b.dataset.t;draw()}else if(b.id==='sd'){SHOWDONE=!SHOWDONE;draw()}else if(b.id==='st'){SHOWTEST=!SHOWTEST;ST=null;draw()}else if(b.id==='rl'){ST=null;load()}else if(b.dataset.d){b.disabled=true;try{await rpc('mv2_admin_done',{p_key:KEY,p_tbl:b.dataset.d,p_id:b.dataset.i,p_done:b.dataset.v==='true'});const k=b.dataset.d==='reports'?'id':'sig';const it=D[b.dataset.d].find(x=>String(x[k])===b.dataset.i);if(it)it.done=b.dataset.v==='true';draw()}catch(er){b.disabled=false;alert('Chưa lưu được, thử lại.')}}});
KEY?load():login();
</script></body></html>
