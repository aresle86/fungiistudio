<script type="module">

 sc.traverse(o=>{if(o.isMesh)o.material=toonMat(o.material)});const bb=new T.Box3().setFromObject(root),c=bb.getCenter(new T.Vector3()),s=bb.getSize(new T.Vector3()).length()*.42,cm=new T.OrthographicCamera(-s,s,s,-s,.01,100);cm.position.copy(c).add(new T.Vector3(.3,.4,1).normalize().multiplyScalar(20));cm.lookAt(c);ri.render(sc,cm);out[k]=ri.domElement.toDataURL('image/png')}
